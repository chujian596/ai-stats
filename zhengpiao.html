<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正票 318期 · 排行榜</title>
<style>
:root{
  --bg:#111317; --panel:#1a1d23; --fg:#edebe5; --dim:#8e939b; --line:#2b3038;
  --red:#ff4d4f; --blue:#4d9fff; --green:#0e9f6e;
  --gold:#e0b25a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.55 "Noto Sans SC","PingFang SC",-apple-system,"Helvetica Neue",sans-serif;
  font-variant-numeric:tabular-nums}
main{max-width:760px;margin:0 auto;padding:16px 12px 34px}
.num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-weight:700}

header{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.kicker{font-size:11px;letter-spacing:.14em;color:var(--dim)}
h1{margin:5px 0 9px;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.01em}
h1 span{font-size:14px;color:var(--dim);font-weight:500;margin-left:8px}
.meta{display:flex;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:2px 8px;font-size:11px;background:var(--panel)}
.dot{width:8px;height:8px;display:inline-block}
.dot.红{background:var(--red)} .dot.蓝{background:var(--blue)} .dot.绿{background:var(--green)}

h2{font-size:12px;letter-spacing:.12em;color:var(--dim);font-weight:600;
  margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}

/* 彩色文字通用 */
.红{color:var(--red)} .蓝{color:var(--blue)} .绿{color:var(--green)}

/* 号码区：整框装全部号码 */
.tierbox{display:block;width:100%;border:1px solid #343a44;background:#1a1d23;
  border-radius:2px;padding:10px 12px;margin-bottom:10px}
.tierbox .tier-head{margin-bottom:8px}
.tierbox .balls{display:flex;flex-wrap:wrap;gap:8px 14px}
.tierbox .b{font-size:16px;font-weight:800;letter-spacing:.02em}
.tierbox .b.红{color:var(--red)} .tierbox .b.蓝{color:var(--blue)} .tierbox .b.绿{color:var(--green)}
.tierbox .bcell{display:inline-flex;flex-direction:column;align-items:center;gap:1px;min-width:24px}
.tierbox .bz{font-style:normal;font-size:10.5px;line-height:1.1;color:#7d8794;font-weight:600;letter-spacing:.02em}

/* 排行榜号码：纯彩色粗体 */
.n{display:inline-block;font-size:13.5px;font-weight:800;letter-spacing:.02em}
.n.红{color:var(--red)} .n.蓝{color:var(--blue)} .n.绿{color:var(--green)}

.tier{margin-bottom:13px}
.tier-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.tier-name{font-size:14px;font-weight:700}
.tier-cost{font-size:11px;color:var(--dim);flex:1}
.copy{border:1px solid var(--line);background:var(--panel);color:var(--fg);
  font-size:11px;padding:3px 10px;cursor:pointer;font-family:inherit;border-radius:2px}
.copy:active{opacity:.7}
.copy.ok{border-color:var(--green);color:var(--green)}
.balls{display:flex;flex-wrap:wrap;gap:6px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.cell{background:var(--panel);padding:8px 9px}
.cell .k{font-size:10px;color:var(--dim)}
.cell .v{font-size:18px;font-weight:700;margin-top:1px}
.cell .v small{font-size:10px;color:var(--dim);font-weight:400;margin-left:2px}

/* 钉死标记（不靠颜色，文字+边框，色弱可辨） */
.ding{display:inline-block;margin-left:3px;padding:1px 3px;font-size:9px;line-height:12px;white-space:nowrap;flex:none;
  border:1px solid #7a4a4a;border-radius:3px;color:#e0a3a3;font-weight:600;vertical-align:middle}
/* 排行榜：圆形进度条 */
.rank2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.col{min-width:0}
.r{min-width:0}
.r .n{flex:none;white-space:nowrap}

.r{display:flex;align-items:center;gap:5px;padding:1px 0;border-bottom:1px solid #1d2128;height:26px}
.r .rk{width:15px;font-size:10px;text-align:right;color:var(--dim);font-weight:700;flex:none}
.r .rk.t12{color:var(--gold)} .r .rk.t14{color:#b9a071}
.r .rk.t16{color:#8e939b} .r .rk.t18{color:#5d636b}
.r .n{font-size:13.5px;flex:none}
.r .v{flex:none;min-width:58px;text-align:right;white-space:nowrap}
.r .bar{flex:1;height:14px;background:#232830;position:relative;min-width:24px;border-radius:7px;overflow:hidden}
.r .bar i{position:absolute;left:0;top:0;bottom:0;display:block;border-radius:7px}
.r .v{width:20px;text-align:right;font-size:11px;font-weight:700;flex:none}

/* 票仓倾斜灯 */
.tilt{margin-bottom:8px;border:1px solid var(--line);background:var(--panel)}
.tl{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid #1d2128}
.tl:last-child{border-bottom:0}
.tl .nm{width:34px;font-size:11px;color:var(--dim);flex:none}
.tl .hd{width:66px;font-size:12px;font-weight:800;flex:none}
.tl .tk{flex:1;height:12px;background:#232830;position:relative;border-radius:6px;min-width:60px}
.tl .tk i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.tl .tk b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.8}
.tl .pv{width:62px;text-align:right;font-size:11.5px;font-weight:800;flex:none}
.tl .md{width:46px;text-align:right;font-size:10px;color:var(--dim);flex:none}

.legend{margin-top:8px;font-size:10px;color:var(--dim)}
.legend b{font-weight:700}
.legend .t12{color:var(--gold)} .legend .t14{color:#b9a071}
.legend .t16{color:#8e939b} .legend .t18{color:#5d636b}

.after-top{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:10px}
.after-top .cell{background:var(--panel)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);padding:3px 7px;font-size:11px;background:#21252c}
.chip b{font-weight:800;font-size:12.5px}
.chip small{color:var(--dim);margin-left:3px;font-size:10px}

.past{width:100%;border-collapse:collapse;font-size:12px}
.past th{text-align:left;font-size:10px;color:var(--dim);font-weight:600;padding:0 5px 5px;border-bottom:1px solid var(--line)}
.past td{padding:6px 5px;border-bottom:1px solid #1d2128;color:var(--dim);vertical-align:middle}
.past td.y{color:var(--fg);font-weight:700}
.past td.t{font-weight:800;font-size:13px}
.past td.t.红{color:var(--red)} .past td.t.蓝{color:var(--blue)} .past td.t.绿{color:var(--green)}
.chip b.红{color:var(--red)} .chip b.蓝{color:var(--blue)} .chip b.绿{color:var(--green)}
.code{display:inline-block;margin-right:6px;white-space:nowrap}
.code b{font-weight:800;font-size:12.5px}
.code em{font-style:normal;color:var(--dim);font-size:10px;margin-left:1px}

footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--dim);line-height:1.7}
footer b{color:var(--fg);font-weight:700}

@media (min-width:560px){ .rank2{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:400px){
  h1{font-size:27px}
  .tierbox .b{font-size:15px}
  .tierbox .balls{gap:7px 12px}
  .r{height:25px;gap:4px}
  .rank2{gap:0 11px}
  .r .bar{min-width:34px}
  .r .v{width:18px;font-size:10.5px}
  .past td{padding:6px 3px}
}

.vitality{margin-top:6px;font-size:11px;color:var(--dim);border:1px solid var(--line);background:var(--panel);padding:7px 10px;line-height:1.6}
.vitality b{color:var(--fg);font-weight:700}
.treg{margin-top:10px}
.treg table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
.treg th{color:var(--dim);font-weight:600;text-align:right;padding:4px 0;border-bottom:1px solid var(--line);font-size:11px}
.treg th:first-child{text-align:left}
.treg td{padding:6px 0;border-bottom:1px solid #23272e;text-align:right;font-variant-numeric:tabular-nums}
.treg td:first-child{text-align:left;font-weight:800}
.cells{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;margin-top:2px;flex:1;min-width:0}
.tc{height:13px;border-radius:2px;background:#262b33}
.tc.on{background:#0e9f6e}
.trow{display:flex;align-items:center;gap:7px;margin-top:5px}
.trow .lb{width:18px;font-size:11px;font-weight:800;color:var(--dim);flex:none}
</style>
</head>

</main>

function pad(n){ return String(n).padStart(2,'0'); }
function colorOf(n){ return REDS.indexOf(n)>=0 ? '红' : (BLUES.indexOf(n)>=0 ? '蓝' : '绿'); }

/* 号码串渲染：23兔 → 彩色23 + 灰兔 */
function codes(str){
  return str.split(' ').filter(Boolean).map(t=>{
    const no=t.slice(0,2), z=t.slice(2);
    const n=parseInt(no,10), c=colorOf(n);
    return `<span class="code"><b class="${c}">${no}</b><em>${z}</em></span>`;
  }).join('');
}

async function copyText(text, btn){
  const old = btn.textContent;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); }
    else { throw new Error('no clipboard'); }
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  btn.textContent='已复制'; btn.classList.add('ok');
  setTimeout(()=>{ btn.textContent=old; btn.classList.remove('ok'); }, 1600);
}

  + `<span class="tag">兵 ${DATA['统计']['兵']}</span>`
  + `<span class="tag">触发 ${DATA['统计']['触发']}</span>`;

/* 四档：方形色块 */
const TIERS=[12,14,16,18];
TIERS.forEach(N=>{
  const nums=DATA['四档'][String(N)];
  const box=el('div','tierbox');
  const head=el('div','tier-head');
  head.innerHTML=`<span class="tier-name">${N} 号</span><span class="tier-cost">随机基准 ${(N/47*100).toFixed(1)}%</span>`;
  const btn=el('button','copy','复制');
  const text=nums.map(pad).join(' ');
  btn.addEventListener('click', ()=>copyText(text, btn));
  head.appendChild(btn);
  box.appendChild(head);
  const balls=el('div','balls');
  nums.forEach(n=>{
    const x=DATA['排行'].find(r=>r['号']===n);
    const cell=el('span','bcell');
    cell.appendChild(el('span','b '+x['波'], pad(n)));
    cell.appendChild(el('em','bz', x['肖']));
    balls.appendChild(cell);
  });
  box.appendChild(balls);
  document.getElementById('tiers').appendChild(box);
});

/* 统计 */
const st=DATA['统计'];
document.getElementById('stats').innerHTML = [
  ['触发兵', st['触发'], '/ '+st['兵']],
  ['有效票', st['有效票'], ''],
  ['平均池', st['池均'], '号/兵'],
  ['空池', st['空池'], '次'],
  ['异常', st['异常'], '次'],
  ['条件库', '18.9万', '条']
].map(([k,v,s])=>`<div class="cell"><div class="k">${k}</div><div class="v num">${v}<small>${s}</small></div></div>`).join('');

/* 票仓倾斜灯 */
const tilt = DATA['偏向'];
if(tilt && tilt['当期'] && tilt['中位'] && Object.keys(tilt['中位']).length){
  const DEF=[['大小','大','小','#e0b25a'],['单双','单','双','#8fa0b5'],['红绿','红','非红',COLOR.红]];
  document.getElementById('tilt').innerHTML = DEF.map(([nm,k,alt,c])=>{
    const cur=tilt['当期'][k], med=tilt['中位'][k];
    const d=cur-med;
    let dir, dc;
    if(nm==='单双'){ dir='无信号'; dc='#5d636b'; }
    else if(nm==='大小'){
      dir = cur>=0.407 ? '偏·大' : '偏·小';
      dc  = cur>=0.407 ? c : '#cfd6de';
    } else {
      dir = cur>=0.484 ? '偏·红' : (cur<=0.231 ? '偏·非红' : '中区');
      dc  = cur>=0.484 ? COLOR.红 : (cur<=0.231 ? '#cfd6de' : '#8e939b');
    }
    return `<div class="tl">
      <span class="nm">${nm}</span>
      <span class="hd" style="color:${c}">${k} ${cur.toFixed(3)}</span>
      <span class="tk"><i style="width:${Math.max(1,cur*100).toFixed(1)}%;background:${c}"></i><b style="left:${Math.min(99,med*100).toFixed(1)}%"></b></span>
      <span class="pv" style="color:${dc}">${dir}</span>
      <span class="md">中位 ${med.toFixed(3)}</span>
    </div>`;
  }).join('');
  const b=tilt['回测'];
  const rp=tilt['当期']['红'], bp=tilt['当期']['大'];
  const head=document.getElementById('tiltNote');
  head.style.color='var(--fg)'; head.style.fontSize='11.5px'; head.style.marginTop='9px';
  head.textContent = `本期读数：红绿灯偏 ${rp>=0.484?'红':(rp<=0.231?'离红':'中区')} · 大小灯偏 ${bp>=0.407?'大':'小'} · 单双灯中性；全部只判波色与大小，不改四档号码`;
  const note2=document.createElement('div');
  note2.className='legend'; note2.style.marginTop='5px';
  head.parentNode.insertBefore(note2, head.nextSibling);
  note2.textContent =
    `回测 ${b['样本']} 期（${b['区间']}）：大小 ${b['大小']}/${b['样本']}（小号一侧基准 ${b['固定']['小侧']}）· 单双 ${b['单双']}/${b['样本']}（双号一侧基准 ${b['固定']['双侧']}）· 红绿 ${b['红绿']}/${b['出手']}。套到四档号码上实测无增益（去红组 −81、去大组 +5）。`;
}

/* 四档命中登记 */
const tr=DATA['四档登记'];
if(tr){
  const rows=[12,14,16,18].map(n=>{
    const v=tr['汇总'][n];
    return `<tr><td>${n} 号</td><td>${v['全期命中']}/${v['全期期数']}<br><span style="color:var(--dim);font-size:10.5px">${v['全期率']}%</span></td>
    <td>${v['近30命中']}/30</td>
    <td>${(v['近30命中']/30*100).toFixed(1)}%</td></tr>`;
  }).join('');
  const cell=n=>tr['近30'].map(x=>`<i class="tc ${x['h'][[12,14,16,18].indexOf(n)]?'on':''}"></i>`).join('');
  const strip=[12,14,16,18].map(n=>`<div class="trow"><span class="lb">${n}</span><div class="cells">${cell(n)}</div></div>`).join('');
  const box=document.createElement('div');
  box.className='treg';
  box.innerHTML=`<table><colgroup><col style="width:26%"><col style="width:30%"><col style="width:26%"><col style="width:18%"></colgroup>
    <thead><tr><th>档位</th><th>全期命中</th><th>近30期</th><th>近30命中率</th></tr></thead><tbody>${rows}</tbody></table>
    <div style="font-size:10.5px;color:var(--dim);margin-top:9px">近 30 期逐期（${tr['近30'][0]['期']} → ${tr['近30'][tr['近30'].length-1]['期']}），绿实＝命中</div>
    ${strip}`;
  document.getElementById('stats').insertAdjacentElement('afterend', box);
}

/* 上期体质 */
const pv=DATA['上期体质'];
if(pv){
  const box=document.createElement('div');
  box.className='vitality';
  box.innerHTML=`上一期 ${pv['期']} 体质：触发 <b>${pv['触发']}</b> 兵 · 命中 <b>${pv['命中']}</b> · 未命中 ${pv['未命中']} · 命中率 <b>${pv['命中率']}%</b> · 特码排第 <b>${pv['名次']}</b> 名`;
  document.getElementById('stats').insertAdjacentElement('afterend', box);
}

/* 排行榜：圆角进度条 */
const items=DATA['排行'];
const maxV=items[0]['票'];
const half=Math.ceil(items.length/2);
[items.slice(0,half), items.slice(half)].forEach(col=>{
  const box=el('div','col');
  box.innerHTML=col.map(r=>{
    const tc=r['档']?'t'+r['档']:'';
    const w=Math.max(2, r['票']/maxV*100);
    return `<div class="r" title="${pad(r['号'])} ${r['波']}波 ${r['肖']} · ${r['票']}票">
      <span class="rk ${tc}">${r['名']}</span>
      <span class="n ${r['波']}">${pad(r['号'])}</span>
      <span class="bar"><i style="width:${w}%;background:${COLOR[r['波']]}"></i></span>
      <span class="v num">${r['票']}${r['钉']?'<span class="ding" title="反向票≥10，T12/T14剔除、T16/T18只显示">钉</span>':''}</span>
    </div>`;
  }).join('');
  document.getElementById('rank2').appendChild(box);
});

/* 特码后：彩色号码 */
const af=DATA['特码后'];
document.getElementById('afterTop').innerHTML = `
  <div class="cell"><div class="k">样本</div><div class="v num">${af['样本']}<small>期</small></div></div>
  <div class="cell"><div class="k">最高频平码</div><div class="v num ${colorOf(af['平码'][0]['号'])}">${pad(af['平码'][0]['号'])}<small>${af['平码'][0]['次']}次</small></div></div>`;
let h='<div class="chips">';
af['平码'].slice(0,12).forEach(x=>{
  h+=`<span class="chip"><b class="${colorOf(x['号'])}">${pad(x['号'])}</b><small>${x['次']}·${x['肖']}</small></span>`;
});
h+='</div><div style="margin-top:9px" class="chips">';
af['生肖'].slice(0,6).forEach(x=>{ h+=`<span class="chip"><small style="margin:0;color:var(--fg)">${x['肖']}</small><small>${x['次']}</small></span>`; });
h+='</div>';
document.getElementById('afterBody').innerHTML=h;

/* 往年今日：全部号码着色 */
document.getElementById('past').innerHTML = DATA['往年今日'].map(p=>{
  const teNo=parseInt(p['特'].slice(0,2),10);
  return `<tr>
    <td class="y">${p['年']}</td>
    <td>${p['日期']}</td>
    <td>${codes(p['平'])}</td>
    <td class="t ${colorOf(teNo)}">${p['特'].slice(0,2)}<span style="color:var(--dim);font-size:10px;font-weight:400">${p['特'].slice(2)}</span></td>
  </tr>`;
}).join('');

/* 页脚 */
const s2=DATA['统计'];
document.getElementById('foot').innerHTML =
`<b>罗盘</b>：条件库 ${s2['条件数'].toLocaleString()} 条 · 池集 ${s2['池集数']} 类 · 用上一期数据出票<br>`
+`<b>口径</b>：2409 净票序（正票×1.0 / 反票×0.5；T12/T14 按净票排、T16/T18 按正票排），净票降序、同票按号码升序；1赔46，命中得47；四档嵌套截取。<br>`
+`<b>钉死</b>：反向票≥10 的号码标「钉」，只作标记、不参与剔除；61 期实测剔除仅 T12 多 1 期，却会误杀大号。<br>`
+`<b>说明</b>：号码颜色即波色，进度条长度按最高票归一；特码后与往年今日为历史统计，仅供参考，不参与排序。`;
</script>
</body>
</html>
