<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>统一球径 · 字号对比</title>
<style>
  :root{--red:#c8322b;--blue:#2456a6;--green:#1f7a4c;--ink:#111;--sub:#777;--line:#e6e6e6;--bg:#f5f5f5}
  *{box-sizing:border-box}
  body{margin:0;padding:22px 16px 30px;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Noto Sans SC",sans-serif}
  .wrap{max-width:560px;margin:0 auto}
  h1{margin:0 0 4px;font-size:19px;font-weight:700}
  .sub{font-size:12.5px;color:var(--sub);margin-bottom:16px}

  .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px 17px;margin-bottom:11px}
  .tag{display:flex;align-items:baseline;gap:8px;margin-bottom:13px}
  .tag b{font-size:13.5px}
  .tag span{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums}
  .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .lbl{font-size:11px;color:var(--sub)}

  .n{border-radius:50%;display:flex;align-items:center;justify-content:center;
     color:#fff;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}

  /* 现在：特号带黑边，球 40 / 字 15 */
  .s0 .n{width:40px;height:40px;font-size:15px;font-weight:600}
  .s0 .sp{box-shadow:0 0 0 2px #111}

  /* A：全部同径 44，字 24 */
  .a .n{width:44px;height:44px;font-size:24px;letter-spacing:-.3px}

  /* B：全部同径 46，字 26 */
  .b .n{width:46px;height:46px;font-size:26px;letter-spacing:-.8px}

  .note{margin-top:4px;padding:13px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;
        font-size:12.5px;color:var(--sub);line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <h1>特码球和其他球一样大 · 只把数字放大</h1>
  <div class="sub">第317期 特 26 ｜ 平特 31 49 30 22 43 24</div>

  <div class="box s0">
    <div class="tag"><b>现在</b><span>球 40 · 字 15 · 特号带黑圈</span></div>
    <div class="row">
      <span class="lbl">特</span>
      <div class="n sp" style="background:var(--blue)">26</div>
      <div style="width:10px"></div>
      <div class="n" style="background:var(--blue)">31</div>
      <div class="n" style="background:var(--green)">49</div>
      <div class="n" style="background:var(--red)">30</div>
      <div class="n" style="background:var(--green)">22</div>
      <div class="n" style="background:var(--green)">43</div>
      <div class="n" style="background:var(--red)">24</div>
    </div>
  </div>

  <div class="box a">
    <div class="tag"><b>A 档</b><span>球 44 · 字 24 · 全部一样大、无黑圈</span></div>
    <div class="row">
      <span class="lbl">特</span>
      <div class="n" style="background:var(--blue)">26</div>
      <div style="width:10px"></div>
      <div class="n" style="background:var(--blue)">31</div>
      <div class="n" style="background:var(--green)">49</div>
      <div class="n" style="background:var(--red)">30</div>
      <div class="n" style="background:var(--green)">22</div>
      <div class="n" style="background:var(--green)">43</div>
      <div class="n" style="background:var(--red)">24</div>
    </div>
  </div>

  <div class="box b">
    <div class="tag"><b>B 档</b><span>球 46 · 字 26 · 数字再大一点</span></div>
    <div class="row">
      <span class="lbl">特</span>
      <div class="n" style="background:var(--blue)">26</div>
      <div style="width:10px"></div>
      <div class="n" style="background:var(--blue)">31</div>
      <div class="n" style="background:var(--green)">49</div>
      <div class="n" style="background:var(--red)">30</div>
      <div class="n" style="background:var(--green)">22</div>
      <div class="n" style="background:var(--green)">43</div>
      <div class="n" style="background:var(--red)">24</div>
    </div>
  </div>

  <div class="note">
    特码靠左边那个「特」字来区分，球本身不做任何放大或描边。
  </div>
</div>
</body>
</html>
