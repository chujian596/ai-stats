<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>每站台账 · 九肖 / 三肖共识</title>
<style>
  :root{--line:#ececec;--sub:#888;--bg:#f5f6f8;--ink:#222}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:1080px;margin:0 auto;padding:12px}
  header h1{font-size:19px;margin-bottom:4px}
  header .meta{font-size:12px;color:var(--sub);line-height:1.7}
  .top-tabs{display:flex;gap:8px;margin:12px 0 0;flex-wrap:nowrap;overflow-x:auto}
  .ttab{white-space:nowrap;padding:10px 16px;border:1px solid var(--line);background:#fff;color:#666;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
  .ttab.on{border-color:#222;background:#222;color:#fff}
  .sub-tabs{display:flex;gap:8px;margin:10px 0;flex-wrap:nowrap;overflow-x:auto}
  .stab{white-space:nowrap;padding:7px 12px;border:1px solid var(--line);background:#fff;color:#666;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
  .stab.on{border-color:#222;background:#fff;color:#222;font-weight:700;box-shadow:inset 0 -2px 0 #222}
  .frame-box{margin-top:10px}
  iframe{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;height:calc(100vh - 150px);min-height:520px;display:block}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>每站台账 · 九肖 / 三肖共识 / 杀三肖</h1>
    <div class="meta">九肖＝每站推荐的恰好 9 肖，逐站逐期记中/错、连对/连错与改料；三肖共识＝各资料源本期杀肖票数、推荐三肖与谁准谁差；杀三肖台账＝每站本站固定杀三肖栏的逐期明细与连对连错。顶部标签切换三类台账，同一链接内切换。</div>
  </header>

  <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">
    <button onclick="refreshAll()" style="padding:7px 12px;border:1px solid #222;border-radius:9px;background:#fff;font-size:13px;font-weight:600">刷新数据</button>
    <a href="compare.html" style="padding:7px 12px;border:1px solid #222;border-radius:9px;background:#222;color:#fff;font-size:13px;font-weight:600;text-decoration:none">左右对比页（九肖 × 杀三肖）</a>
    <span style="font-size:12px;color:#888">点一下重新拉取后台最新台账（不是重新去网站抓取）</span>
  </div>

  <div class="top-tabs">
    <div class="ttab on" id="tabNine" onclick="switchTop('nine')">九肖台账</div>
    <div class="ttab" id="tabThree" onclick="switchTop('three')">三肖共识</div>
    <div class="ttab" id="tabKill3" onclick="switchTop('kill3')">杀三肖台账</div>
    <div class="ttab" id="tabExtra" onclick="switchTop('extra')">扩展台账</div>
    <div class="ttab" id="tabReg" onclick="switchTop('reg')">站点清单</div>
  </div>

  <div class="sub-tabs" id="subTabs" style="display:none">
    <div class="stab on" data-k="kill" onclick="switchThree('kill')">杀肖票数</div>
    <div class="stab" data-k="rec" onclick="switchThree('rec')">推荐三肖</div>
    <div class="stab" data-k="rank" onclick="switchThree('rank')">谁准谁差</div>
  </div>

  <div class="frame-box">
    <iframe id="frameNine" src="nine-zodiac.html?v=17"></iframe>
    <iframe id="frameThree" src="stats.html?v=2#kill" class="hidden"></iframe>
    <iframe id="frameKill3" src="kill3-ledger.html?v=20" class="hidden"></iframe>
    <iframe id="frameExtra" src="extra-ledger.html?v=1" class="hidden"></iframe>
  <iframe id="frameReg" src="site-registry.html?v=1" class="hidden"></iframe>
  </div>
</div>

<script>
var top='nine', threeK='kill';
function switchTop(t){
  top=t;
  var on={'nine':'tabNine','three':'tabThree','kill3':'tabKill3','extra':'tabExtra','reg':'tabReg'};
  Object.keys(on).forEach(function(k){
    document.getElementById(on[k]).className='ttab'+(k===t?' on':'');
  });
  document.getElementById('subTabs').style.display=t==='three'?'flex':'none';
  document.getElementById('frameNine').classList.toggle('hidden',t!=='nine');
  document.getElementById('frameThree').classList.toggle('hidden',t!=='three');
  document.getElementById('frameKill3').classList.toggle('hidden',t!=='kill3');
  document.getElementById('frameExtra').classList.toggle('hidden',t!=='extra');
  document.getElementById('frameReg').classList.toggle('hidden',t!=='reg');
  if(t==='three') switchThree(threeK,true);
}
function refreshAll(){
  ['frameNine','frameThree','frameKill3','frameExtra','frameReg'].forEach(function(id){
    var f=document.getElementById(id);
    var base=f.getAttribute('data-base')||f.src.split('?')[0].split('#')[0];
    f.setAttribute('data-base',base);
    if(id==='frameThree'){ f.src=base+'?t='+Date.now()+'#'+threeK; }
    else { f.src=base+'?t='+Date.now(); }
  });
}
function switchThree(k,keepLoad){
  threeK=k;
  var frame=document.getElementById('frameThree');
  Array.prototype.forEach.call(document.querySelectorAll('.stab'),function(el){
    el.className='stab'+(el.dataset.k===k?' on':'');
  });
  try{
    var w=frame.contentWindow;
    if(w && w.switchTab){ w.switchTab(k); }
    else { frame.src='stats.html?v=2#'+k; }
  }catch(e){ frame.src='stats.html?v=2#'+k; }
}
document.getElementById('frameThree').addEventListener('load',function(){
  try{ this.contentWindow.switchTab(threeK); }catch(e){}
});
</script>
</body>
</html>
