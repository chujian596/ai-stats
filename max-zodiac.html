<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>每站台账 · 九肖 / 三肖共识</title>
<style>
  :root{--line:#ececec;--sub:#888;--bg:#f5f6f8;--ink:#222}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:1080px;margin:0 auto;padding:12px}
  header h1{font-size:19px;margin-bottom:4px}
  header .meta{font-size:12px;color:var(--sub);line-height:1.7}
  .top-tabs{display:flex;gap:8px;margin:12px 0 0;flex-wrap:nowrap;overflow-x:auto}
  .ttab{white-space:nowrap;padding:10px 16px;border:1px solid var(--line);background:#fff;color:#666;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
  .ttab.on{border-color:#222;background:#222;color:#fff}
  .sub-tabs{display:flex;gap:8px;margin:10px 0;flex-wrap:nowrap;overflow-x:auto}
  .stab{white-space:nowrap;padding:7px 12px;border:1px solid var(--line);background:#fff;color:#666;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
  .stab.on{border-color:#222;background:#fff;color:#222;font-weight:700;box-shadow:inset 0 -2px 0 #222}
  .frame-box{margin-top:10px}
  iframe{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;height:calc(100vh - 150px);min-height:520px;display:block}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>每站台账</h1>
    <div class="meta">九肖＝每站推荐的恰好 9 肖，逐站逐期记中/错、连对/连错与改料；三肖共识＝各资料源本期杀肖票数、推荐三肖与谁准谁差。顶部标签切换两类台账。</div>
  </header>

  <div class="top-tabs">
    <div class="ttab on" id="tabNine" onclick="switchTop('nine')">九肖台账</div>
    <div class="ttab" id="tabThree" onclick="switchTop('three')">三肖共识</div>
  </div>

  <div class="sub-tabs" id="subTabs" style="display:none">
    <div class="stab on" data-k="kill" onclick="switchThree('kill')">杀肖票数</div>
    <div class="stab" data-k="rec" onclick="switchThree('rec')">推荐三肖</div>
    <div class="stab" data-k="rank" onclick="switchThree('rank')">谁准谁差</div>
  </div>

  <div class="frame-box">
    <iframe id="frameNine" src="nine-zodiac.html"></iframe>
    <iframe id="frameThree" src="stats.html#kill" class="hidden"></iframe>
  </div>
</div>

<script>
var top='nine', threeK='kill';
function switchTop(t){
  top=t;
  document.getElementById('tabNine').className='ttab'+(t==='nine'?' on':'');
  document.getElementById('tabThree').className='ttab'+(t==='three'?' on':'');
  document.getElementById('subTabs').style.display=t==='three'?'flex':'none';
  document.getElementById('frameNine').classList.toggle('hidden',t!=='nine');
  document.getElementById('frameThree').classList.toggle('hidden',t!=='three');
  if(t==='three') switchThree(threeK,true);
}
function switchThree(k,keepLoad){
  threeK=k;
  var frame=document.getElementById('frameThree');
  Array.prototype.forEach.call(document.querySelectorAll('.stab'),function(el){
    el.className='stab'+(el.dataset.k===k?' on':'');
  });
  try{
    var w=frame.contentWindow;
    if(w && w.switchTab){ w.switchTab(k); }
    else { frame.src='stats.html#'+k; }
  }catch(e){ frame.src='stats.html#'+k; }
}
document.getElementById('frameThree').addEventListener('load',function(){
  try{ this.contentWindow.switchTab(threeK); }catch(e){}
});
</script>
</body>
</html>
