plugins { id 'java' }

repositories {
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://maven.aliyun.com/repository/public' }
    google()
    mavenCentral()
}

sourceSets {
    main {
        java { srcDirs = ['../src'] }
    }
    test {
        java { srcDirs = ['src/test/java'] }
    }
}

dependencies {
    compileOnly files('/home/user/android-sdk/platforms/android-34/android.jar')
    testCompileOnly files('/home/user/android-sdk/platforms/android-34/android.jar')
    testRuntimeOnly files('/home/user/android-sdk/platforms/android-34/android.jar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation files('libs/monitor-1.6.1.jar')
    testImplementation files('libs/core-1.5.0.jar')
    testImplementation files('libs/annotation-1.3.0.jar')
}

test {
    useJUnit()
    maxHeapSize = '2g'
    testLogging { showStandardStreams = true }
    systemProperty 'robolectric.logging', 'stdout'
}
