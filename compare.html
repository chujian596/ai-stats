<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九肖 × 杀三肖 · 左右对比</title>
<style>
  :root{--line:#ececec;--sub:#888;--bg:#f5f6f8;--ink:#222;--blue:#2456a6;--red:#c8322b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:1100px;margin:0 auto;padding:12px}
  header h1{font-size:18px;margin-bottom:4px}
  header .meta{font-size:12px;color:var(--sub);line-height:1.7}
  .bar{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
  .bar select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
  .bar button{padding:7px 12px;border:1px solid #222;border-radius:9px;background:#fff;font-size:13px;font-weight:600;cursor:pointer}
  .bar .hint{font-size:12px;color:#888}

  /* 顶部双排行对照：始终左右并排 */
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .rcard{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .rc-head{padding:12px 12px 4px}
  .rc-title{font-weight:700;font-size:15px}
  .rc-title.left{color:var(--blue)} .rc-title.right{color:var(--red)}
  .rc-sub{font-size:11.5px;color:var(--sub);padding:2px 12px 8px;line-height:1.6}
  .rrow{display:flex;align-items:center;gap:6px;padding:7px 12px;border-bottom:1px solid var(--line)}
  .rrow:last-child{border-bottom:none}
  .rno{width:20px;height:20px;border-radius:6px;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#666;flex:none}
  .rno.t1{background:#222;color:#fff}.rno.t2{background:#555;color:#fff}.rno.t3{background:#999;color:#fff}
  .rz{flex:1;font-weight:700;white-space:nowrap}
  .rz.hot{color:var(--red)}
  .rbar{flex:none;width:38px;height:6px;border-radius:4px;background:#f0f2f5;overflow:hidden}
  .rbar i{display:block;height:100%}
  .left .rbar i{background:var(--blue)} .right .rbar i{background:var(--red)}
  .rc{font-variant-numeric:tabular-nums;color:var(--sub);font-size:11px;text-align:right;white-space:nowrap}
  .tag{font-size:10px;color:var(--red);font-weight:700;margin-left:3px}

  .ledger-title{font-size:13px;font-weight:700;margin:16px 0 8px;color:var(--ink)}
  .ledger{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .col{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .col-head{padding:10px 14px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line)}
  .col-head.left{color:var(--blue)} .col-head.right{color:var(--red)}
  iframe{width:100%;border:none;background:#fff;min-height:560px;display:block}
  @media(max-width:900px){
    .ledger{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>九肖 × 杀三肖 · 左右对比</h1>
    <div class="meta">左＝九肖首肖排行（各站把哪个肖放第一位），右＝杀三肖被杀排行（各肖被多少站杀掉）。两张排行同屏左右对照；下方为完整逐站台账，可下钻复盘。</div>
  </header>

  <div class="bar">
    <label class="hint">期号</label>
    <select id="periodSel"></select>
    <button onclick="refreshAll()">刷新数据</button>
    <span class="hint">九肖仅 316 期起有记录；切换期号两侧排行与下方台账同步。</span>
  </div>
  <div class="hint" id="issueNote" style="margin:2px 0 8px;color:#222"></div>

  <div class="cmp">
    <div class="rcard left">
      <div class="rc-head"><div class="rc-title left" id="nineTitle">本期首肖排行</div></div>
      <div class="rc-sub" id="nineSub"></div>
      <div id="nineRank"></div>
    </div>
    <div class="rcard right">
      <div class="rc-head"><div class="rc-title right" id="killTitle">本期被杀排行</div></div>
      <div class="rc-sub" id="killSub"></div>
      <div id="killRank"></div>
    </div>
  </div>

  <div class="ledger-title">完整逐站台账（下钻复盘）</div>
  <div class="ledger">
    <div class="col">
      <div class="col-head left">九肖台账</div>
      <iframe id="frameNine" src="nine-zodiac.html?v=11"></iframe>
    </div>
    <div class="col">
      <div class="col-head right">杀三肖台账</div>
      <iframe id="frameKill" src="kill3-ledger.html?v=10"></iframe>
    </div>
  </div>
</div>

<script>
var ZOD=['马','蛇','龙','兔','虎','牛','鼠','猪','狗','鸡','猴','羊'];
var LG=null, KR=null, PEND=null, CUR=null;
var fNine=document.getElementById('frameNine');
var fKill=document.getElementById('frameKill');
var BASE={nine:'nine-zodiac.html?v=11', kill:'kill3-ledger.html?v=10'};

function fetchJson(u){return fetch(u,{cache:'no-cache'}).then(function(r){return r.json();});}

function rowsHtml(rows, actual, unit, side){
  if(!rows.length) return '<div class="rc-sub">暂无记录</div>';
  var max=rows[0].n||1;
  return rows.map(function(row,i){
    var no=i+1, cls=no<=3?'t'+no:'';
    var bar=Math.round((row.n||0)/max*100);
    var hot=row.z===actual;
    var tag=hot?'<span class="tag">特肖</span>':'';
    var pct=row.total?Math.round(row.n/row.total*100):0;
    var num=unit==='站'? (row.n+' 站 · '+pct+'%') : (row.n+' 票');
    return '<div class="rrow"><div class="rno '+cls+'">'+no+'</div>'+
      '<div class="rz'+(hot?' hot':'')+'">'+row.z+tag+'</div>'+
      '<div class="rbar"><i style="width:'+bar+'%"></i></div>'+
      '<div class="rc">'+num+'</div></div>';
  }).join('');
}

function renderNine(cur){
  var per=LG.periods[String(cur)]||LG.periods[cur];
  if(!per){ document.getElementById('nineSub').textContent='该期无九肖记录'; document.getElementById('nineRank').innerHTML=''; return; }
  var agg={}, total=0;
  Object.keys(per.stations).forEach(function(k){
    var r=per.stations[k];
    if(r.status==='有九肖' && r.zodiacs && r.zodiacs.length){
      var z=r.zodiacs[0]; agg[z]=(agg[z]||0)+1; total++;
    }
  });
  var rows=ZOD.map(function(z){return {z:z,n:agg[z]||0,total:total};})
    .sort(function(a,b){return b.n-a.n||a.z.localeCompare(b.z,'zh');});
  document.getElementById('nineTitle').textContent='本期首肖排行 · 第'+cur+'期';
  document.getElementById('nineSub').textContent='本期 '+total+' 站把哪个肖放在第一位；特肖 '+per.actual+'。';
  document.getElementById('nineRank').innerHTML=rowsHtml(rows, per.actual, '站', 'left');
}

function renderKill(cur){
  var per=KR.periods[String(cur)]||KR.periods[cur];
  if(!per||!per.rank){ document.getElementById('killSub').textContent='该期无杀肖排行'; document.getElementById('killRank').innerHTML=''; return; }
  var rows=per.rank.map(function(r){return {z:r.z,n:r.kill};});
  document.getElementById('killTitle').textContent='本期被杀排行 · 第'+cur+'期';
  document.getElementById('killSub').textContent='第 '+cur+' 期 · '+per.sites+' 站有杀三肖；特肖 '+per.actual+' 被 '+per.specialKilled+' 站杀掉（杀错）。';
  document.getElementById('killRank').innerHTML=rowsHtml(rows, per.actual, '票', 'right');
}

/* ---- 待开期（未对账）推荐排行 ---- */
function renderNinePending(){
  var agg={}, total=0;
  (PEND.sites||[]).forEach(function(s){
    if(s.status==='有九肖' && s.zodiacs && s.zodiacs.length){
      var z=s.zodiacs[0]; agg[z]=(agg[z]||0)+1; total++;
    }
  });
  var rows=ZOD.map(function(z){return {z:z,n:agg[z]||0,total:total};})
    .sort(function(a,b){return b.n-a.n||a.z.localeCompare(b.z,'zh');});
  document.getElementById('nineTitle').textContent='待开首肖排行 · 第'+PEND.period+'期';
  document.getElementById('nineSub').textContent='本期 '+total+' 站把哪个肖放在第一位；待开推荐 · 未对账。';
  document.getElementById('nineRank').innerHTML=rowsHtml(rows, null, '站', 'left');
}

function renderKillPending(){
  var rows=(PEND.pendingKill||[]).map(function(r){return {z:r.z,n:r.kill};});
  document.getElementById('killTitle').textContent='待开被杀排行 · 第'+PEND.period+'期';
  document.getElementById('killSub').textContent='第 '+PEND.period+' 期 · '+PEND.killSites+' 站有杀三肖；待开推荐 · 未对账。';
  document.getElementById('killRank').innerHTML=rowsHtml(rows, null, '票', 'right');
}

function isPendingCur(cur){
  return PEND && PEND.status==='pending' && String(cur)===String(PEND.period);
}

function render(cur){
  CUR=cur;
  if(isPendingCur(cur)){ renderNinePending(); renderKillPending(); }
  else { renderNine(cur); renderKill(cur); }
  syncFrames(cur);
  var issues=Object.keys(LG.periods).sort(function(a,b){return +a-+b;});
  var last=issues[issues.length-1];
  var note='台账/快照期号 '+last;
  if(PEND && PEND.status==='pending') note+=' · 待开 '+PEND.period;
  document.getElementById('issueNote').textContent=note;
}

/* 下方 iframe 期号同步 */
function doc(f){ try{return f.contentDocument;}catch(e){return null;} }
function sel(f){ var d=doc(f); return d?d.getElementById('periodSel'):null; }
function hasOpt(s,v){ if(!s)return false; for(var i=0;i<s.options.length;i++){if(s.options[i].value===v)return true;} return false; }
function syncFrames(cur){
  [fNine,fKill].forEach(function(f){
    var s=sel(f);
    if(s && hasOpt(s,cur) && s.value!==cur){ s.value=cur; s.dispatchEvent(new Event('change')); }
  });
}
function fit(f){ var d=doc(f); if(!d||!d.body)return; f.style.height=Math.max(d.body.scrollHeight||560,560)+'px'; }
function bind(f){
  f.addEventListener('load',function(){
    var s=sel(f);
    if(s) s.addEventListener('change',function(){ var v=s.value; if(v&&v!==CUR){ CUR=v; document.getElementById('periodSel').value=v; render(v); } });
    var t=0; var tm=setInterval(function(){fit(f); if(++t>=8)clearInterval(tm);},250);
  });
}
bind(fNine); bind(fKill);

function buildOptions(){
  var sel=document.getElementById('periodSel');
  sel.innerHTML='';
  var issues=Object.keys(LG.periods).sort(function(a,b){return +a-+b;});
  if(PEND && PEND.status==='pending'){
    var po=document.createElement('option');
    po.value=PEND.period; po.textContent='第'+PEND.period+'期（待开）'; sel.appendChild(po);
  }
  issues.forEach(function(i){var o=document.createElement('option');o.value=i;o.textContent='第'+i+'期';sel.appendChild(o);});
  return issues;
}

function refreshAll(){
  var n=Date.now();
  Promise.all([
    fetchJson('data/max-zodiac-ledger.json?v='+n).then(function(d){LG=d;}),
    fetchJson('data/kill-rank-stats.json?v='+n).then(function(d){KR=d;}),
    fetchJson('data/current-recommend.json?v='+n).then(function(d){PEND=d;}).catch(function(){PEND=null;})
  ]).then(function(){
    var issues=buildOptions();
    var sel=document.getElementById('periodSel');
    var def=(PEND&&PEND.status==='pending')?String(PEND.period):issues[issues.length-1];
    sel.value=def;
    fNine.src=BASE.nine.split('?')[0]+'?t='+n;
    fKill.src=BASE.kill.split('?')[0]+'?t='+n;
    render(def);
  });
}

Promise.all([
  fetchJson('data/max-zodiac-ledger.json').then(function(d){LG=d;}),
  fetchJson('data/kill-rank-stats.json').then(function(k){KR=k;}),
  fetchJson('data/current-recommend.json').then(function(d){PEND=d;}).catch(function(){PEND=null;})
]).then(function(){
  var issues=buildOptions();
  var sel=document.getElementById('periodSel');
  var def=(PEND&&PEND.status==='pending')?String(PEND.period):issues[issues.length-1];
  sel.value=def;
  sel.addEventListener('change',function(){render(sel.value);});
  render(def);
}).catch(function(e){
  document.getElementById('nineRank').innerHTML='<div class="rc-sub">数据加载失败：'+e+'</div>';
});
</script>
</body>
</html>
