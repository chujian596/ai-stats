<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九肖 × 杀三肖 · 当期对比</title>
<style>
  :root{--line:#ececec;--sub:#888;--bg:#f5f6f8;--ink:#222;--blue:#2456a6;--red:#c8322b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:1100px;margin:0 auto;padding:12px}
  header h1{font-size:18px;margin-bottom:4px}
  header .meta{font-size:12px;color:var(--sub);line-height:1.7}
  .bar{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
  .bar button{padding:7px 12px;border:1px solid #222;border-radius:9px;background:#fff;font-size:13px;font-weight:600;cursor:pointer}
  .bar .hint{font-size:12px;color:#888}

  /* 顶部双排行对照：始终左右并排 */
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .rcard{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .rc-head{padding:12px 12px 4px}
  .rc-title{font-weight:700;font-size:15px}
  .rc-title.left{color:var(--blue)} .rc-title.right{color:var(--red)}
  .rc-sub{font-size:11.5px;color:var(--sub);padding:2px 12px 8px;line-height:1.6}
  .rrow{display:flex;align-items:center;gap:6px;padding:7px 12px;border-bottom:1px solid var(--line)}
  .rrow:last-child{border-bottom:none}
  .rno{width:20px;height:20px;border-radius:6px;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#666;flex:none}
  .rno.t1{background:#222;color:#fff}.rno.t2{background:#555;color:#fff}.rno.t3{background:#999;color:#fff}
  .rz{flex:1;font-weight:700;white-space:nowrap}
  .rz.hot{color:var(--red)}
  .rbar{flex:none;width:38px;height:6px;border-radius:4px;background:#f0f2f5;overflow:hidden}
  .rbar i{display:block;height:100%}
  .left .rbar i{background:var(--blue)} .right .rbar i{background:var(--red)}
  .rc{font-variant-numeric:tabular-nums;color:var(--sub);font-size:11px;text-align:right;white-space:nowrap}
  .tag{font-size:10px;color:var(--red);font-weight:700;margin-left:3px}

  .ledger-title{font-size:13px;font-weight:700;margin:16px 0 8px;color:var(--ink)}
  .ledger{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .col{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .col-head{padding:10px 14px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
  .col-head.left{color:var(--blue)} .col-head.right{color:var(--red)}
  .col-arrow{font-size:12px;color:var(--sub);font-weight:400}
  .col-body.collapsed{display:none}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td{padding:7px 12px;border-top:1px solid var(--line);vertical-align:middle}
  td.site{font-weight:600;white-space:nowrap}
  td.site .sys{display:block;font-size:10px;color:var(--sub);font-weight:400}
  .seq-no{display:inline-block;margin-right:5px;padding:0 6px;border-radius:6px;background:#eef2f8;color:#5b6675;border:1px solid #dde5ef;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums}
  .zods{color:var(--ink);letter-spacing:.5px}
  .empty{color:var(--sub)}
  .zchip{display:inline-block;background:#f0f2f5;border-radius:6px;padding:1px 5px;margin:1px 2px;font-size:11px}
  .back{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}
  .back a{flex:1;min-width:220px;text-align:center;text-decoration:none;color:var(--ink);border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:13px;font-weight:600;background:#fff}
  .back a .sub{display:block;font-size:11px;color:var(--sub);font-weight:400;margin-top:2px}
  @media(max-width:900px){
    .ledger{grid-template-columns:1fr}
  }
  .tier-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .tier-bar .tier-label{font-size:11px;color:var(--sub);font-weight:700;margin-right:2px}
  .tier-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
  .tier-btn .n{font-weight:800;font-variant-numeric:tabular-nums}
  .tier-btn .nm{color:var(--sub);font-size:10px;margin-left:3px}
  .tier-btn.active{border-color:var(--ink);background:var(--ink);color:#fff}
  .tier-btn.active .nm{color:rgba(255,255,255,.72)}
  .tier-hint{font-size:10px;color:var(--sub);margin-left:auto}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>九肖 × 杀三肖 · 当期对比</h1>
    <div class="meta">本页只显示当前待开期的原始推荐（未对账）。左＝九肖首肖排行（各站把哪个肖放第一位），右＝杀三肖被杀排行（各肖被多少站杀掉）；下方为待开逐站推荐。往期已开奖复盘请走底部台账入口按日期回看。</div>
  </header>

  <div class="bar">
    <button onclick="refreshAll()">刷新数据</button>
    <span class="hint" id="barHint"></span>
  </div>
  <div class="hint" id="issueNote" style="margin:2px 0 8px;color:#222"></div>
  <div class="tier-bar" id="tierBar"></div>

  <div class="cmp">
    <div class="rcard left">
      <div class="rc-head"><div class="rc-title left" id="nineTitle">待开首肖排行</div></div>
      <div class="rc-sub" id="nineSub"></div>
      <div id="nineRank"></div>
    </div>
    <div class="rcard right">
      <div class="rc-head"><div class="rc-title right" id="killTitle">待开被杀排行</div></div>
      <div class="rc-sub" id="killSub"></div>
      <div id="killRank"></div>
    </div>
  </div>

  <div class="ledger-title" id="siteTitle">待开逐站推荐</div>
  <div class="ledger">
    <div class="col">
      <div class="col-head left" onclick="toggleCol('nine')"><span>各站九肖</span><span class="col-arrow" id="arrow-nine">▾</span></div>
      <div class="col-body" id="body-nine"><table id="nineSites"></table></div>
    </div>
    <div class="col">
      <div class="col-head right" onclick="toggleCol('kill')"><span>各站杀三肖</span><span class="col-arrow" id="arrow-kill">▾</span></div>
      <div class="col-body" id="body-kill"><table id="killSites"></table></div>
    </div>
  </div>

  <div class="back">
    <a href="ziliao-center.html#nine">进入九肖台账 · 回看往期复盘<span class="sub">往期已对账对错、连错预警、历史累计</span></a>
    <a href="ziliao-center.html#kill">进入杀三肖台账 · 回看往期复盘<span class="sub">往期各站所杀三肖、中错与连对连错</span></a>
  </div>
</div>

<script>
var ZOD=['马','蛇','龙','兔','虎','牛','鼠','猪','狗','鸡','猴','羊'];
var PEND=null, ALIAS={};

// ===== 站池档位：core 基线始终包含，added 按 grade 白名单截断；仅作用于当期待开推荐 =====
var TIERS=[
  {key:'100', name:'现跑基线', grades:[], desc:'现在一直在跟的站'},
  {key:'139', name:'三齐全', grades:['A'], desc:'九肖+杀三+平特都有'},
  {key:'147', name:'双覆盖', grades:['A','B'], desc:'九肖+杀三，缺平特'},
  {key:'151', name:'仅杀三', grades:['A','B','Ck'], desc:'再加只有杀三栏目'},
  {key:'192', name:'仅九肖', grades:['A','B','Ck','Cn'], desc:'再加只有九肖栏目'},
  {key:'194', name:'全量', grades:['A','B','Ck','Cn','D'], desc:'含无核心栏目的站'}
];
var TIER_KEY='site-tier', DIR={sites:[],byId:{},byKey:{}};
function curTierKey(){ try{return localStorage.getItem(TIER_KEY)||'100';}catch(e){return '100';} }
function tierDef(){ var k=curTierKey(); return TIERS.find(function(t){return t.key===k;})||TIERS[0]; }
function keyOf(s){ return s.siteId || ((s.system||'')+':'+(s.siteKey||'')); }
function dirOf(s){ if(!s) return null; var k=keyOf(s); return DIR.byId[k]||DIR.byKey[s.siteKey]||null; }
function tierAllowed(s){ var d=dirOf(s); if(!d) return true; if(d.tier==='core') return true; return tierDef().grades.indexOf(d.grade)>=0; }
function tierCount(def){ return DIR.sites.filter(function(d){return d.tier==='core'||def.grades.indexOf(d.grade)>=0;}).length; }
function renderTierBar(){
  var bar=document.getElementById('tierBar'); if(!bar) return;
  var cur=curTierKey();
  bar.innerHTML='<span class="tier-label">站池</span>'+TIERS.map(function(t){
    var n=tierCount(t), act=t.key===cur?' active':'';
    return '<button type="button" class="tier-btn'+act+'" data-tier="'+t.key+'" title="'+t.desc+'"><span class="n">'+n+'</span><span class="nm">'+t.name+'</span></button>';
  }).join('')+'<span class="tier-hint" id="tierHint"></span>';
  Array.prototype.forEach.call(bar.querySelectorAll('.tier-btn'),function(b){
    b.addEventListener('click',function(){ try{localStorage.setItem(TIER_KEY,b.dataset.tier);}catch(e){} renderTierBar(); render(); });
  });
  var def=tierDef(), excluded=DIR.sites.filter(function(x){return x.tier==='added'&&def.grades.indexOf(x.grade)<0;});
  var hint=document.getElementById('tierHint'); if(hint) hint.textContent='本档 '+tierCount(def)+' 站'+(excluded.length?' · 未纳入 '+excluded.length:'');
}
function loadDir(){ return fetchJson('data/site-directory.json').then(function(dir){ DIR.sites=dir.sites||[]; DIR.byId=dir.bySiteId||{}; DIR.byKey=dir.bySiteKey||{}; }).catch(function(){}); }

function fetchJson(u){return fetch(u,{cache:'no-cache'}).then(function(r){return r.json();});}

function rowsHtml(rows, actual, unit, side){
  if(!rows.length) return '<div class="rc-sub">暂无记录</div>';
  var max=rows[0].n||1;
  return rows.map(function(row,i){
    var no=i+1, cls=no<=3?'t'+no:'';
    var bar=Math.round((row.n||0)/max*100);
    var hot=row.z===actual;
    var tag=hot?'<span class="tag">特肖</span>':'';
    var pct=row.total?Math.round(row.n/row.total*100):0;
    var num=unit==='站'? (row.n+' 站 · '+pct+'%') : (row.n+' 票');
    return '<div class="rrow"><div class="rno '+cls+'">'+no+'</div>'+
      '<div class="rz'+(hot?' hot':'')+'">'+row.z+tag+'</div>'+
      '<div class="rbar"><i style="width:'+bar+'%"></i></div>'+
      '<div class="rc">'+num+'</div></div>';
  }).join('');
}

function siteName(s){
  var k=s.system+':'+s.siteKey;
  return ALIAS[k]||ALIAS[s.siteKey]||s.siteKey;
}
function seqTag(s){return (s && s.seq)?'<span class="seq-no">#'+s.seq+'</span>':'';}
function chips(zs){ return (zs||[]).map(function(z){return '<span class="zchip">'+z+'</span>';}).join('')||'<span class="empty">—</span>'; }

function renderNinePending(){
  var agg={}, total=0;
  (PEND.sites||[]).forEach(function(s){
    if(tierAllowed(s) && s.status==='有九肖' && s.zodiacs && s.zodiacs.length){
      var z=s.zodiacs[0]; agg[z]=(agg[z]||0)+1; total++;
    }
  });
  var rows=ZOD.map(function(z){return {z:z,n:agg[z]||0,total:total};})
    .sort(function(a,b){return b.n-a.n||a.z.localeCompare(b.z,'zh');});
  document.getElementById('nineTitle').textContent='待开首肖排行 · 第'+PEND.period+'期';
  var carryN=(PEND.sites||[]).filter(function(s){return tierAllowed(s)&&s.carried;}).length;
  var carryTxt=carryN?('；上版沿用 '+carryN+' 站（计入票数）'):'';
  var missTxt=(PEND.missingCount||0)?('；本轮未纳入 '+(PEND.missingCount||0)+' 站（不计入票数，非改料）'):'';
  document.getElementById('nineSub').textContent='本期 '+total+' 站把哪个肖放在第一位；待开推荐 · 未对账'+carryTxt+missTxt+'。';
  document.getElementById('nineRank').innerHTML=rowsHtml(rows, null, '站', 'left');
}

function renderKillPending(){
  var kagg={}; var killN=0;
  (PEND.sites||[]).forEach(function(s){
    if(tierAllowed(s)&&s.killZodiacs&&s.killZodiacs.length){
      killN++;
      s.killZodiacs.forEach(function(z){kagg[z]=(kagg[z]||0)+1;});
    }
  });
  var rows=Object.keys(kagg).map(function(z){return {z:z,n:kagg[z]};}).sort(function(a,b){return b.n-a.n||a.z.localeCompare(b.z,'zh');});
  document.getElementById('killTitle').textContent='待开被杀排行 · 第'+PEND.period+'期';
  var carryN=(PEND.sites||[]).filter(function(s){return tierAllowed(s)&&s.carried;}).length;
  var carryTxt=carryN?('；上版沿用 '+carryN+' 站（计入票数）'):'';
  var missTxt=(PEND.missingCount||0)?('；本轮未纳入 '+(PEND.missingCount||0)+' 站（不计入票数，非改料）'):'';
  document.getElementById('killSub').textContent='第 '+PEND.period+' 期 · '+killN+' 站有杀三肖；本档现场重算 · 待开推荐 · 未对账'+carryTxt+missTxt+'。';
  document.getElementById('killRank').innerHTML=rowsHtml(rows, null, '票', 'right');
}

function renderSiteTables(){
  var sites=(PEND.sites||[]).filter(tierAllowed).slice();
  sites.sort(function(a,b){return siteName(a).localeCompare(siteName(b),'zh');});
  var n9=document.getElementById('nineSites');
  n9.innerHTML='';
  sites.forEach(function(s){
    var zcell;
    if(s.status==='还没更新'){ zcell='<span class="empty">还没更新</span>'; }
    else if(s.status==='无九肖栏目'){ zcell='<span class="empty">无九肖栏目</span>'; }
    else { zcell='<span class="zods">'+chips(s.zodiacs)+'</span>'; }
    var tr=document.createElement('tr');
    tr.innerHTML='<td class="site">'+seqTag(s)+siteName(s)+'<span class="sys">'+s.siteKey+' · '+s.system+'</span></td><td>'+zcell+'</td>';
    n9.appendChild(tr);
  });
  var nk=document.getElementById('killSites');
  nk.innerHTML='';
  var killSites=sites.filter(function(s){return s.killZodiacs&&s.killZodiacs.length;});
  killSites.sort(function(a,b){return siteName(a).localeCompare(siteName(b),'zh');});
  killSites.forEach(function(s){
    var tr=document.createElement('tr');
    tr.innerHTML='<td class="site">'+seqTag(s)+siteName(s)+'<span class="sys">'+s.siteKey+' · '+s.system+'</span></td><td><span class="zods">'+chips(s.killZodiacs)+'</span></td>';
    nk.appendChild(tr);
  });
  if(!killSites.length){ nk.innerHTML='<tr><td class="empty">暂无杀三肖推荐</td></tr>'; }
}

function toggleCol(k){
  var body=document.getElementById('body-'+k);
  var arr=document.getElementById('arrow-'+k);
  var collapsed=body.classList.toggle('collapsed');
  if(arr) arr.textContent=collapsed?'▸':'▾';
}

function render(){
  if(!PEND){ return; }
  var note='待开第 '+PEND.period+' 期';
  if(PEND.updatedAt) note+=' · 快照时间 '+PEND.updatedAt;
  if(PEND.status==='pending'){
    document.getElementById('issueNote').textContent=note+'（待开奖 · 未对账）';
    document.getElementById('barHint').textContent='本页为第'+PEND.period+'期待开推荐；往期复盘见底部台账入口。';
    document.getElementById('siteTitle').textContent='待开逐站推荐 · 第'+PEND.period+'期';
    renderNinePending(); renderKillPending(); renderSiteTables();
  }else{
    document.getElementById('issueNote').textContent='第'+PEND.period+'期资料待抓取，快照入库后自动显示。';
    document.getElementById('barHint').textContent='当前暂无待开推荐。';
    document.getElementById('nineRank').innerHTML='<div class="rc-sub">暂无记录</div>';
    document.getElementById('killRank').innerHTML='<div class="rc-sub">暂无记录</div>';
    document.getElementById('nineSites').innerHTML='';
    document.getElementById('killSites').innerHTML='';
  }
}

function refreshAll(){
  var n=Date.now();
  Promise.all([
    fetchJson('data/current-recommend.json?v='+n).then(function(d){PEND=d;}).catch(function(){PEND=null;}),
    fetchJson('data/site-aliases.json?v='+n).then(function(d){ALIAS=d.aliases||{};}).catch(function(){ALIAS={};}),
    loadDir()
  ]).then(function(){ render(); renderTierBar(); });
}

Promise.all([
  fetchJson('data/current-recommend.json').then(function(d){PEND=d;}).catch(function(){PEND=null;}),
  fetchJson('data/site-aliases.json').then(function(d){ALIAS=d.aliases||{};}).catch(function(){ALIAS={};}),
  loadDir()
]).then(function(){ render(); renderTierBar(); }).catch(function(e){
  document.getElementById('nineRank').innerHTML='<div class="rc-sub">数据加载失败：'+e+'</div>';
});
</script>
<div class="meta" style="margin-top:14px;text-align:center;color:var(--sub);font-size:11px">版本 F-110 · 逐站九肖 / 杀三肖栏目可折叠展开 · 档位现场重算</div>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
