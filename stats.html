<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>资料统计</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f5f5f5;color:#1a1a1a;font-size:17px;min-height:100vh;padding-bottom:40px}
  .wrap{max-width:480px;margin:0 auto;padding:14px}
  .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .hd h1{font-size:19px;font-weight:700;margin:0}
  .btn{border:1px solid #ccc;background:#fff;color:#333;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600}
  .btn:active{background:#eee}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{flex:1;text-align:center;padding:10px 4px;border:1px solid #ddd;background:#fff;color:#666;border-radius:10px;font-size:15px;font-weight:600}
  .tab.on{border-color:#333;color:#1a1a1a;background:#fff;font-weight:700}
  .card{background:#fff;border:1px solid #eee;border-radius:14px;padding:14px;margin-bottom:14px}
  .card h2{font-size:15px;font-weight:700;margin:0 0 10px}
  .muted{color:#888;font-size:13px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:15px}
  .row:last-child{border-bottom:none}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}
  .tag.good{background:#e8f5e9;color:#2e7d32}
  .tag.bad{background:#fdecea;color:#c62828}
  .tag.watch{background:#f0f0f0;color:#777}
  .zod{display:inline-block;min-width:34px;text-align:center;padding:4px 6px;margin:2px;border:1px solid #eee;border-radius:8px;font-size:14px}
  .zod.kill{border-color:#c62828;color:#c62828}
  .zod.rec{border-color:#2e7d32;color:#2e7d32}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .board .cell{border:1px solid #eee;border-radius:10px;padding:8px 4px;text-align:center}
  .board .cell .z{font-size:16px;font-weight:700}
  .board .cell .n{font-size:12px;color:#888;margin-top:2px}
  .auth{padding:10px 0;border-bottom:1px solid #f0f0f0}
  .auth .top{display:flex;justify-content:space-between;align-items:center}
  .auth .name{font-weight:600;font-size:15px}
  .auth .meta{font-size:13px;color:#888;margin-top:3px}
  .auth .detail{margin-top:8px;font-size:13px;color:#555;line-height:1.7;display:none}
  .auth.open .detail{display:block}
  .bar{height:6px;background:#eee;border-radius:3px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:#333}
  .loading{text-align:center;color:#888;padding:30px 0}
  .balls{display:flex;gap:6px;flex-wrap:wrap}
  .ball{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
  .ball.sp{border:2px solid #d4af37}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1>资料统计</h1>
    <button class="btn" id="refreshBtn" onclick="loadAll()">刷新</button>
  </div>
  <div class="muted" id="fetchedAt" style="margin:-6px 0 12px"></div>

  <div class="tabs">
    <div class="tab on" id="tabKill" onclick="switchTab('kill')">杀肖追踪</div>
    <div class="tab" id="tabRec" onclick="switchTab('rec')">推荐肖</div>
    <div class="tab" id="tabHot" onclick="switchTab('hot')">冷热号</div>
  </div>

  <div id="panelKill"></div>
  <div id="panelRec" style="display:none"></div>
  <div id="panelHot" style="display:none"></div>
  <div class="muted" style="margin-top:20px;line-height:1.6">注：以上均为历史数据统计，开奖为随机事件，过往命中率不代表以后结果，仅供参考。</div>
</div>

<script>
var BASE='https://ismkog.xn--n8jaf0byahm4a2c4cybyssjl201en76e.xn--q9jyb4c:21044';
var ZOD=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
var NUM2Z={};
[['马',[1,13,25,37,49]],['蛇',[2,14,26,38]],['龙',[3,15,27,39]],['兔',[4,16,28,40]],['虎',[5,17,29,41]],['牛',[6,18,30,42]],['鼠',[7,19,31,43]],['猪',[8,20,32,44]],['狗',[9,21,33,45]],['鸡',[10,22,34,46]],['猴',[11,23,35,47]],['羊',[12,24,36,48]]].forEach(function(z){ z[1].forEach(function(n){ NUM2Z[n]=z[0]; }); });

var state={ authors:[], official:{}, currentPeriod:0, fetchedAt:'' };
var LS_KEY='stats_snapshot_v1';

function $(id){ return document.getElementById(id); }

function decodeEnt(s){
  return s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&nbsp;/g,' ');
}
function cleanHtml(c){
  c=c.replace(/<[^>]+>/g,'');
  c=decodeEnt(c).replace(/開/g,'开').replace(/鷄/g,'鸡').replace(/錯/g,'错').replace(/\s+/g,' ');
  return c;
}

// 分类帖子类型
function classifyTopic(topic){
  if(/绝杀一肖|绝杀1肖|绝杀两肖|绝杀二肖|绝杀三肖|规杀|杀肖/.test(topic)) return 'kill';
  if(/九肖/.test(topic)) return 'rec9';
  if(/六肖/.test(topic)) return 'rec6';
  if(/五肖/.test(topic)) return 'rec5';
  if(/四肖/.test(topic)) return 'rec4';
  if(/三肖/.test(topic)) return 'rec3';
  return '';
}

var MARK_HIT=['准','对','中','✔','✅'];
var MARK_MISS=['错','❌','✘'];

function parseContent(content, kind){
  var c=cleanHtml(content);
  var marks=[], re=/(\d{2,3})(期|杀|♡|☆|▼|☞)/g, m;
  while((m=re.exec(c))!==null){ marks.push({pos:m.index, period:parseInt(m[1],10), sep:m[2]}); }
  var rows=[];
  for(var i=0;i<marks.length;i++){
    var pos=marks[i].pos, end=i+1<marks.length?marks[i+1].pos:c.length;
    var seg=c.slice(pos,end);
    var period=marks[i].period, zods=[];
    var openIdx=seg.search(/开/);
    var pred=openIdx>=0?seg.slice(0,openIdx):seg;
    if(marks[i].sep==='杀'){
      var mm=/杀([鼠牛虎兔龙蛇马羊猴鸡狗猪])/.exec(pred);
      if(mm) zods=[mm[1]];
    } else {
      // 前半段里挑出生肖字（去重保序），兼容各种括号/混号码/空格
      for(var k=0;k<pred.length;k++){
        var ch=pred[k];
        if(ZOD.indexOf(ch)>=0 && zods.indexOf(ch)<0) zods.push(ch);
      }
    }
    var rm=/开[:：]?\s*([鼠牛虎兔龙蛇马羊猴鸡狗猪])?\s*(\d{1,2})?\s*(准|对|中|错|✅|✔|❌|✘)?/.exec(seg);
    var rz=rm?rm[1]:null, rn=rm?rm[2]:null, mk=rm?rm[3]:null;
    rows.push({period:period, zods:zods, resZod:rz, resNum:rn, mark:mk});
  }
  return rows;
}

function fetchJson(url){
  return fetch(url,{cache:'no-cache'}).then(function(r){ return r.json(); });
}

// 官方开奖：期号 -> 特肖
function loadOfficial(){
  return fetchJson(BASE+'/api/v1/lotteries/macao/histories?year=2026').then(function(arr){
    var map={};
    (arr||[]).forEach(function(x){
      var nums=x.winner_numbers||[];
      var sp=nums[nums.length-1];
      map[x.draw]={ specialNum:sp, specialZod:NUM2Z[sp], all:nums };
    });
    state.official=map;
  }).catch(function(){ state.official={}; });
}

function judgeRow(kind, row){
  // 返回 'hit' | 'miss' | null(未开奖)
  var off=state.official[row.period];
  if(off && off.specialZod){
    if(kind==='kill'){
      return row.zods.indexOf(off.specialZod)>=0 ? 'miss' : 'hit';
    } else {
      return row.zods.indexOf(off.specialZod)>=0 ? 'hit' : 'miss';
    }
  }
  // 无官方结果，回退帖子自标
  if(!row.mark) return null;
  if(MARK_MISS.indexOf(row.mark)>=0) return 'miss';
  if(MARK_HIT.indexOf(row.mark)>=0) return 'hit';
  return null;
}

function loadAll(){
  var btn=$('refreshBtn'); btn.textContent='抓取中…'; btn.disabled=true;
  $('panelKill').innerHTML='<div class="loading">正在抓取资料…</div>';
  loadOfficial().then(function(){
    return fetchList();
  }).then(function(){
    saveSnapshot();
    renderAll();
    btn.textContent='刷新'; btn.disabled=false;
  }).catch(function(e){
    btn.textContent='刷新'; btn.disabled=false;
    $('panelKill').innerHTML='<div class="loading">抓取失败，请重试</div>';
  });
}

function fetchList(){
  var authors={};
  var pages=[1,2];
  var chain=Promise.resolve();
  pages.forEach(function(pg){
    chain=chain.then(function(){
      return fetchJson(BASE+'/api/v1/forums?lottery=macao&page='+pg+'&per_page=100');
    }).then(function(d){
      var items=(d&&d.data)||[];
      items.forEach(function(it){
        var kind=classifyTopic(it.topic||'');
        if(!kind) return;
        var name=(it.user&&it.user.nickname)||'匿名';
        var key=name+'|'+kind;
        if(!authors[key]) authors[key]={ name:name, threadId:it.id, topic:it.topic, kind:kind, rows:{} };
        authors[key].threadId=it.id;
        authors[key].topic=it.topic;
      });
    });
  });
  return chain.then(function(){
    var keys=Object.keys(authors);
    var c=0;
    function next(){
      if(c>=keys.length) return;
      var a=authors[keys[c]]; c++;
      return fetchJson(BASE+'/api/v1/forums/'+a.threadId).then(function(d){
        var x=d&&d.data?d.data:d;
        var rows=parseContent(x.content||'', a.kind);
        rows.forEach(function(r){
          if(r.zods.length===0) return;
          a.rows[r.period]=r;
        });
        return next();
      }).catch(function(){ return next(); });
    }
    return next();
  }).then(function(){ state.authors=Object.keys(authors).map(function(k){ return authors[k]; }); });
}

function authorStats(a){
  var periods=Object.keys(a.rows).map(Number).sort(function(x,y){return y-x;});
  var hit=0, miss=0, unresolved=0;
  var fHit=0, fMiss=0; // 第一肖命中(仅推荐类)
  periods.forEach(function(p){
    var row=a.rows[p];
    var j=judgeRow(a.kind, row);
    if(j==='hit') hit++; else if(j==='miss') miss++; else unresolved++;
    if(a.kind.indexOf('rec')===0){
      var off=state.official[p];
      if(off&&off.specialZod&&row.zods[0]){
        if(row.zods[0]===off.specialZod) fHit++; else fMiss++;
      }
    }
  });
  var total=hit+miss;
  var acc=total>0?hit/total:null;
  var fTotal=fHit+fMiss;
  var fAcc=fTotal>0?fHit/fTotal:null;
  var cls='watch';
  if(total>=10){ cls=acc>=0.7?'good':'bad'; }
  var cur=null;
  periods.forEach(function(p){ if(!state.official[p]) cur=p; });
  var curRow=cur!=null?a.rows[cur]:null;
  return { periods:periods, hit:hit, miss:miss, unresolved:unresolved, total:total, acc:acc, fHit:fHit, fMiss:fMiss, fAcc:fAcc, cls:cls, cur:cur, curRow:curRow };
}

function classifyLabel(cls){ return cls==='good'?'准的':cls==='bad'?'差的':'观察'; }

function switchTab(t){
  ['kill','rec','hot'].forEach(function(k){
    $('panel'+(k==='kill'?'Kill':k==='rec'?'Rec':'Hot')).style.display = k===t?'':'none';
    $('tab'+(k==='kill'?'Kill':k==='rec'?'Rec':'Hot')).className='tab'+(k===t?' on':'');
  });
}

function renderAll(){
  $('fetchedAt').textContent = state.fetchedAt?('上次更新：'+state.fetchedAt):'';
  renderKill(); renderRec(); renderHot();
}

// 杀肖汇总：各肖被多少准作者杀 / 多少差作者杀
function renderKill(){
  var list=state.authors.filter(function(a){return a.kind==='kill';});
  var goodKill={}, badKill={};
  list.forEach(function(a){
    var s=authorStats(a);
    if(!s.curRow) return;
    s.curRow.zods.forEach(function(z){
      if(s.cls==='good') goodKill[z]=(goodKill[z]||0)+1;
      else if(s.cls==='bad') badKill[z]=(badKill[z]||0)+1;
    });
  });
  var html='<div class="card"><h2>本期杀肖汇总</h2><div class="muted">准的作者杀掉的肖（可参考排除） vs 差的作者杀掉的肖（留意反着看）</div><div class="board" style="margin-top:10px">';
  ZOD.forEach(function(z){
    var g=goodKill[z]||0, b=badKill[z]||0;
    html+='<div class="cell"><div class="z">'+z+'</div><div class="n">准'+g+' / 差'+b+'</div></div>';
  });
  html+='</div></div>';

  // 作者列表
  var sorted=list.slice().sort(function(x,y){
    var sx=authorStats(x), sy=authorStats(y);
    return (sy.acc||0)-(sx.acc||0);
  });
  html+='<div class="card"><h2>杀肖作者（'+list.length+'）</h2>';
  sorted.forEach(function(a,idx){
    var s=authorStats(a);
    var pct=s.acc!=null?Math.round(s.acc*100)+'%':'—';
    var curTxt=s.curRow?('本期杀：'+s.curRow.zods.join(' ')):'本期暂无';
    html+='<div class="auth" onclick="this.classList.toggle(\'open\')">'
      +'<div class="top"><span class="name">'+esc(a.name)+'</span><span class="tag '+s.cls+'">'+classifyLabel(s.cls)+'</span></div>'
      +'<div class="meta">'+esc(a.topic)+' · 准'+s.hit+' 错'+s.miss+' · 准确率'+pct+'</div>'
      +'<div class="meta">'+curTxt+'</div>'
      +'<div class="bar"><i style="width:'+(s.acc!=null?Math.round(s.acc*100):0)+'%"></i></div>'
      +'<div class="detail">';
    s.periods.slice(0,30).forEach(function(p){
      var r=a.rows[p], j=judgeRow(a.kind,r);
      var jt=j==='hit'?'准':j==='miss'?'错':'待开';
      html+=p+'期 杀['+r.zods.join('')+'] → '+jt+'<br>';
    });
    html+='</div></div>';
  });
  html+='</div>';
  $('panelKill').innerHTML=html;
}

function renderRec(){
  var list=state.authors.filter(function(a){return a.kind.indexOf('rec')===0;});
  // 第一肖频次
  var firstCount={};
  // 按类型统计第一肖命中率
  var typeStat={ rec6:{h:0,m:0}, rec9:{h:0,m:0}, rec4:{h:0,m:0}, rec5:{h:0,m:0}, rec3:{h:0,m:0} };
  list.forEach(function(a){
    var s=authorStats(a);
    if(s.curRow&&s.curRow.zods[0]) firstCount[s.curRow.zods[0]]=(firstCount[s.curRow.zods[0]]||0)+1;
    if(typeStat[a.kind]){ typeStat[a.kind].h+=s.fHit; typeStat[a.kind].m+=s.fMiss; }
  });
  function fr(t){ var d=typeStat[t]; var n=d.h+d.m; return n>0?Math.round(d.h/n*100)+'%':'—'; }
  var html='<div class="card"><h2>第一肖命中率（对照特肖）</h2><div class="muted">推荐列表排第一的肖，历史上开出特肖的比例</div>'
    +'<div class="row"><span>九肖 第一肖</span><span>'+fr('rec9')+'</span></div>'
    +'<div class="row"><span>六肖 第一肖</span><span>'+fr('rec6')+'</span></div>'
    +'<div class="row"><span>四肖 第一肖</span><span>'+fr('rec4')+'</span></div>'
    +'<div class="row"><span>五肖 第一肖</span><span>'+fr('rec5')+'</span></div>'
    +'<div class="row"><span>三肖 第一肖</span><span>'+fr('rec3')+'</span></div></div>';

  html+='<div class="card"><h2>本期推荐第一肖频次</h2><div class="muted">各帖推荐列表排第一的肖，被提到最多的</div><div class="board" style="margin-top:10px">';
  ZOD.forEach(function(z){
    var n=firstCount[z]||0;
    html+='<div class="cell"><div class="z">'+z+'</div><div class="n">'+n+'帖</div></div>';
  });
  html+='</div></div>';

  var sorted=list.slice().sort(function(x,y){return (authorStats(y).acc||0)-(authorStats(x).acc||0);});
  html+='<div class="card"><h2>推荐作者（'+list.length+'）</h2>';
  sorted.forEach(function(a){
    var s=authorStats(a);
    var pct=s.acc!=null?Math.round(s.acc*100)+'%':'—';
    var fpct=s.fAcc!=null?'第一肖'+Math.round(s.fAcc*100)+'%':'';
    var curTxt=s.curRow?('本期：'+s.curRow.zods.join(' ')):'本期暂无';
    html+='<div class="auth" onclick="this.classList.toggle(\'open\')">'
      +'<div class="top"><span class="name">'+esc(a.name)+'</span><span class="tag '+s.cls+'">'+classifyLabel(s.cls)+'</span></div>'
      +'<div class="meta">'+esc(a.topic)+' · 中'+s.hit+' 没中'+s.miss+' · 命中率'+pct+(fpct?' · '+fpct:'')+'</div>'
      +'<div class="meta">'+curTxt+'</div>'
      +'<div class="detail">';
    s.periods.slice(0,30).forEach(function(p){
      var r=a.rows[p], j=judgeRow(a.kind,r);
      var jt=j==='hit'?'中':j==='miss'?'没中':'待开';
      html+=p+'期 ['+r.zods.join('')+'] → '+jt+'<br>';
    });
    html+='</div></div>';
  });
  html+='</div>';
  $('panelRec').innerHTML=html;
}

function ballColor(n){
  var red=[1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46];
  var blue=[3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48];
  if(red.indexOf(n)>=0) return '#e74c3c';
  if(blue.indexOf(n)>=0) return '#3498db';
  return '#27ae60';
}

function renderHot(){
  var off=state.official;
  var draws=Object.keys(off).map(Number).sort(function(a,b){return b-a;});
  var recent=draws.slice(0,30);
  var numCount={}, zodCount={};
  recent.forEach(function(p){
    var nums=off[p].all||[];
    nums.forEach(function(n){ numCount[n]=(numCount[n]||0)+1; });
    var sz=off[p].specialZod; if(sz) zodCount[sz]=(zodCount[sz]||0)+1;
  });
  var hot=Object.keys(numCount).map(Number).sort(function(a,b){return numCount[b]-numCount[a];}).slice(0,10);
  var cold=[]; for(var n=1;n<=49;n++){ if(!numCount[n]) cold.push(n); }
  var html='<div class="card"><h2>最近开奖（特号）</h2><div class="balls">';
  draws.slice(0,10).forEach(function(p){
    var sp=off[p].specialNum;
    html+='<div class="ball sp" style="background:'+ballColor(sp)+'" title="'+p+'期">'+String(sp).padStart(2,'0')+'</div>';
  });
  html+='</div></div>';

  html+='<div class="card"><h2>最近30期热号</h2><div>';
  hot.forEach(function(n){ html+='<span class="zod rec">'+String(n).padStart(2,'0')+'<br><span style="font-size:12px">'+numCount[n]+'次</span></span>'; });
  html+='</div></div>';

  html+='<div class="card"><h2>最近30期冷号（未出）</h2><div>';
  if(cold.length===0) html+='<span class="muted">无</span>';
  cold.forEach(function(n){ html+='<span class="zod kill">'+String(n).padStart(2,'0')+'</span>'; });
  html+='</div></div>';

  html+='<div class="card"><h2>特肖出现次数（近30期）</h2>';
  ZOD.forEach(function(z){
    html+='<div class="row"><span>'+z+'</span><span>'+(zodCount[z]||0)+'次</span></div>';
  });
  html+='</div>';
  $('panelHot').innerHTML=html;
}

function esc(s){ return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

function saveSnapshot(){
  state.fetchedAt=new Date().toLocaleString('zh-CN');
  try{ localStorage.setItem(LS_KEY, JSON.stringify({authors:state.authors, fetchedAt:state.fetchedAt})); }catch(e){}
}
function loadSnapshot(){
  try{
    var s=JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if(s&&s.authors){ state.authors=s.authors; state.fetchedAt=s.fetchedAt||''; return true; }
  }catch(e){}
  return false;
}

// 启动：先读快照渲染，再后台刷新
loadSnapshot();
loadOfficial().then(function(){
  if(state.authors.length===0){ loadAll(); } else { renderAll(); }
});
</script>
</body>
</html>
