<script>
var BASE='https://ismkog.xn--n8jaf0byahm4a2c4cybyssjl201en76e.xn--q9jyb4c:21044';
var ZOD=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
var NUM2Z={};
[['马',[1,13,25,37,49]],['蛇',[2,14,26,38]],['龙',[3,15,27,39]],['兔',[4,16,28,40]],['虎',[5,17,29,41]],['牛',[6,18,30,42]],['鼠',[7,19,31,43]],['猪',[8,20,32,44]],['狗',[9,21,33,45]],['鸡',[10,22,34,46]],['猴',[11,23,35,47]],['羊',[12,24,36,48]]].forEach(function(z){ z[1].forEach(function(n){ NUM2Z[n]=z[0]; }); });

var state={ cross:null, track:null, img:null, authors:[], official:{}, currentPeriod:0, fetchedAt:'', tw:{ source:{}, columns:[] }, forum:{ source:{}, columns:[] } };
var LS_KEY='stats_snapshot_v1';

function $(id){ return document.getElementById(id); }

function decodeEnt(s){
  return s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&nbsp;/g,' ');
}
function cleanHtml(c){
  c=c.replace(/<[^>]+>/g,'');
  c=decodeEnt(c).replace(/開/g,'开').replace(/鷄/g,'鸡').replace(/錯/g,'错').replace(/\s+/g,' ');
  return c;
}

// 分类帖子类型
function classifyTopic(topic){
  if(/绝杀一肖|绝杀1肖|绝杀两肖|绝杀二肖|绝杀三肖|规杀|杀肖/.test(topic)) return 'kill';
  if(/九肖/.test(topic)) return 'rec9';
  if(/六肖/.test(topic)) return 'rec6';
  if(/五肖/.test(topic)) return 'rec5';
  if(/四肖/.test(topic)) return 'rec4';
  if(/三肖/.test(topic)) return 'rec3';
  return '';
}

var MARK_HIT=['准','对','中','✔','✅'];
var MARK_MISS=['错','❌','✘'];

function parseContent(content, kind){
  var c=cleanHtml(content);
  var marks=[], re=/(\d{2,3})(期|杀|♡|☆|▼|☞)/g, m;
  while((m=re.exec(c))!==null){ marks.push({pos:m.index, period:parseInt(m[1],10), sep:m[2]}); }
  var rows=[];
  for(var i=0;i<marks.length;i++){
    var pos=marks[i].pos, end=i+1<marks.length?marks[i+1].pos:c.length;
    var seg=c.slice(pos,end);
    var period=marks[i].period, zods=[];
    var openIdx=seg.search(/开/);
    var pred=openIdx>=0?seg.slice(0,openIdx):seg;
    if(marks[i].sep==='杀'){
      var mm=/杀([鼠牛虎兔龙蛇马羊猴鸡狗猪])/.exec(pred);
      if(mm) zods=[mm[1]];
    } else {
      // 前半段里挑出生肖字（去重保序），兼容各种括号/混号码/空格
      for(var k=0;k<pred.length;k++){
        var ch=pred[k];
        if(ZOD.indexOf(ch)>=0 && zods.indexOf(ch)<0) zods.push(ch);
      }
    }
    var rm=/开[:：]?\s*([鼠牛虎兔龙蛇马羊猴鸡狗猪])?\s*(\d{1,2})?\s*(准|对|中|错|✅|✔|❌|✘)?/.exec(seg);
    var rz=rm?rm[1]:null, rn=rm?rm[2]:null, mk=rm?rm[3]:null;
    rows.push({period:period, zods:zods, resZod:rz, resNum:rn, mark:mk});
  }
  return rows;
}

function fetchJson(url,timeout){
  var ms=timeout||9000;
  var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  var p=fetch(url,{cache:'no-cache',signal:ctl?ctl.signal:undefined}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  });
  // 外部源不可达时不能让整页卡在“抓取中”，到点就放弃
  var t=new Promise(function(_,rej){
    setTimeout(function(){ try{ if(ctl) ctl.abort(); }catch(e){}; rej(new Error('timeout')); }, ms);
  });
  return Promise.race([p,t]);
}

// 官方开奖：期号 -> 特肖
function loadOfficial(){
  return fetchJson(BASE+'/api/v1/lotteries/macao/histories?year=2026').then(function(arr){
    var map={};
    (arr||[]).forEach(function(x){
      var nums=x.winner_numbers||[];
      var sp=nums[nums.length-1];
      map[x.draw]={ specialNum:sp, specialZod:NUM2Z[sp], all:nums };
    });
    state.official=map;
  }).catch(function(){ state.official={}; });
}

// 文字墙对账快照（后端脚本生成，静态 JSON，同目录）
function loadTextwall(){
  // 优先用 118 图库 30 栏目的识图结构化结果 data/img-extract.json
  return fetchJson('data/img-extract.json',10000).then(function(d){
    if(!d||!d.cols) throw new Error('empty');
    var Z='鼠牛虎兔龙蛇马羊猴鸡狗猪';
    var per=d.period||LATEST_PER;
    var cols=[];
    Object.keys(d.cols).forEach(function(k){
      var c=d.cols[k]||{};
      var recZ=(c.rec||[]).filter(function(x){return Z.indexOf(x)>=0;});
      var killZ=(c.kill||[]).filter(function(x){return Z.indexOf(x)>=0;});
      var hasKill=killZ.length>0;
      var hasRec=recZ.length>0;
      var zs=hasKill?killZ:recZ;
      var t=c.title||k;
      cols.push({ name:t, title:t, topic:c.type||'', kind:hasKill?'kill':(hasRec?'rec':'other'),
        current:{ period:per, zods:zs },
        rows:[{ period:per, zods:zs, verdict:'pending' }],
        cls:'watch', hit:0, miss:0, unresolved:0, changed:false, mismatch:[], changedPeriods:[], missingCount:0, fetchedAt:'' });
    });
    state.tw={ source:{ siteName:'118图库（30 栏目逐张识图）', siteNo:'118', listApi:'data/img-extract.json' }, columns:cols };
  }).catch(function(){
    return fetchJson('textwall-snapshot.json').then(function(d){
      state.tw.source=(d&&d.source)||{};
      state.tw.columns=(d&&d.columns)||[];
    }).catch(function(){ state.tw={ source:{}, columns:[] }; });
  });
}

// 归档 JSON 里的生肖字段是 Python 列表的字符串形式（"['龙', '羊']"），
// 旧代码直接当数组用，取 [0] 拿到的是 "["，导致「第一肖」全 0。这里统一归一化。
function _zArr(v){
  if(Array.isArray(v)) return v.map(function(z){ return String(z).trim(); }).filter(Boolean);
  if(typeof v === 'string'){
    var q = v.match(/['"]([^'"]+)['"]/g);
    if(q && q.length) return q.map(function(x){ return x.replace(/['"]/g,'').trim(); }).filter(Boolean);
    return Array.from(v).filter(function(c){ return ZODIAC_LIST.indexOf(c) >= 0; });
  }
  return [];
}
function _isKill(v){ return v === true || v === 1 || v === '1' || v === 'True' || v === 'true' || v === 'kill'; }
var ZODIAC_LIST = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];

// 论坛后台对账汇总（forum_reader.py 生成，静态 JSON，同目录）
function loadForum(){
  function apply(d){ state.forum.source=(d&&d.source)||{}; state.forum.columns=(d&&d.columns)||[]; }
  // 优先用当期解析好的 data/forum-319.json（318 条，a=作者 t=标题 z=生肖 k=是否杀）
  return fetchLatestPeriod().then(loadPeriods).then(function(){
    var per0=curPer();
    return fetchJson('data/forum-'+per0+'.json',12000);
  }).then(function(d){
    if(d&&d.detail&&d.detail.length){
      var per=d.period||LATEST_PER;
      var cols=d.detail.map(function(x){
        var zz = _zArr(x.z);
        return { name:x.a, title:x.a, topic:x.t, kind: (_isKill(x.k)?'kill':'rec'),
          current:{ period:per, zods:zz },
          rows:[{ period:per, zods:zz, verdict:'pending' }],
          cls:'watch', hit:0, miss:0, unresolved:0, acc:null, missRate:null, mismatchCount:0, changed:false, mismatch:[], changedPeriods:[], missingCount:0, fetchedAt:'' };
      });
      state.forum={ source:{ siteName:'公开论坛', listApi:'/api/v1/forums?lottery=macao', detailApi:'/api/v1/forums/{threadId}', access:'6 页 × 100 条' }, columns:cols };
      return;
    }
    throw new Error('empty');
  }).catch(function(){
    return fetchJson('forum-summary.json').then(apply).catch(function(){
      state.forum={ source:{}, columns:[] };
    });
  });
}

function judgeRow(kind, row){
  // 返回 'hit' | 'miss' | null(未开奖)
  var off=state.official[row.period];
  if(off && off.specialZod){
    if(kind==='kill'){
      return row.zods.indexOf(off.specialZod)>=0 ? 'miss' : 'hit';
    } else {
      return row.zods.indexOf(off.specialZod)>=0 ? 'hit' : 'miss';
    }
  }
  // 无官方结果，回退帖子自标
  if(!row.mark) return null;
  if(MARK_MISS.indexOf(row.mark)>=0) return 'miss';
  if(MARK_HIT.indexOf(row.mark)>=0) return 'hit';
  return null;
}

function loadAll(){
  var btn=$('refreshBtn'); btn.textContent='加载中…'; btn.disabled=true;
  Promise.all([
    loadImg().catch(function(){}),
    loadForum().catch(function(){})
  ]).then(function(){
    renderAll();
    btn.textContent='刷新'; btn.disabled=false;
  }).catch(function(){
    btn.textContent='刷新'; btn.disabled=false;
  });
}

function fetchList(){
  var authors={};
  var pages=[1,2,3,4,5,6];
  // 六页并发，单页失败就跳过；串行排队会把整页拖到“抓取中”出不来
  var chain=Promise.all(pages.map(function(pg){
    return fetchJson(BASE+'/api/v1/forums?lottery=macao&page='+pg+'&per_page=100',4500)
      .catch(function(){ return { data: [] }; })
      .then(function(d){
        var items=(d&&d.data)||[];
        items.forEach(function(it){
          var kind=classifyTopic(it.topic||'');
          if(!kind) return;
          var name=(it.user&&it.user.nickname)||'匿名';
          var key=name+'|'+kind;
          if(!authors[key]) authors[key]={ name:name, threadId:it.id, topic:it.topic, kind:kind, rows:{} };
          authors[key].threadId=it.id;
          authors[key].topic=it.topic;
        });
      });
  }));
  return chain.then(function(){
    var keys=Object.keys(authors);
    var c=0;
    function next(){
      if(c>=keys.length) return Promise.resolve();
      var a=authors[keys[c]]; c++;
      return fetchJson(BASE+'/api/v1/forums/'+a.threadId,4500).then(function(d){
        var x=d&&d.data?d.data:d;
        var rows=parseContent(x.content||'', a.kind);
        rows.forEach(function(r){
          if(r.zods.length===0) return;
          a.rows[r.period]=r;
        });
      }).catch(function(){}).then(next);
    }
    var ws=[];
    for(var i=0;i<4;i++) ws.push(next());
    return Promise.all(ws);
  }).then(function(){ state.authors=Object.keys(authors).map(function(k){ return authors[k]; }); });
}

function authorStats(a){
  var periods=Object.keys(a.rows).map(Number).sort(function(x,y){return y-x;});
  var hit=0, miss=0, unresolved=0;
  var fHit=0, fMiss=0; // 第一肖命中(仅推荐类)
  periods.forEach(function(p){
    var row=a.rows[p];
    var j=judgeRow(a.kind, row);
    if(j==='hit') hit++; else if(j==='miss') miss++; else unresolved++;
    if(a.kind.indexOf('rec')===0){
      var off=state.official[p];
      if(off&&off.specialZod&&row.zods[0]){
        if(row.zods[0]===off.specialZod) fHit++; else fMiss++;
      }
    }
  });
  var total=hit+miss;
  var acc=total>0?hit/total:null;
  var fTotal=fHit+fMiss;
  var fAcc=fTotal>0?fHit/fTotal:null;
  var cls='watch';
  if(total>=10){ cls=acc>=0.7?'good':'bad'; }
  var cur=null;
  periods.forEach(function(p){ if(!state.official[p]) cur=p; });
  var curRow=cur!=null?a.rows[cur]:null;
  return { periods:periods, hit:hit, miss:miss, unresolved:unresolved, total:total, acc:acc, fHit:fHit, fMiss:fMiss, fAcc:fAcc, cls:cls, cur:cur, curRow:curRow };
}

function classifyLabel(cls){ return cls==='good'?'准的':cls==='bad'?'差的':'观察'; }

var TAB_MAP={ overview:'Overview', kill:'Kill', rec:'Rec', rank:'Rank', tw:'Tw', forum:'Forum', hot:'Hot', doc:'Doc' , img:'Img' };
var TAB_HINT={
  overview: '下一期哪些肖最该避开、哪些被推荐最多——只看这一页就够了',
  rank: '所有资料源按命中率从高到低排，绿色=准的，红色=差的，灰色=样本不足',
  kill: '各资料源本期杀了哪些肖，按票数排——杀得越多的肖越该避开',
  rec: '各资料源本期推荐了哪些肖，以及排第一的肖历史上命中率多少',
  tw: '联盟站各栏目明细：每个栏目每期杀什么、准了几期错了几期',
  forum: '论坛各帖子明细：每个作者每期杀什么、准了几期错了几期',
  hot: '最近开了哪些特号、哪些号出得多（热号）哪些没出过（冷号）',
  doc: '这页是什么、数据从哪来、怎么判断准不准'
, img:'118图库30个栏目：谁推了几个肖、谁在杀、推减杀净下来还剩什么' };
function switchTab(t){
  Object.keys(TAB_MAP).forEach(function(k){
    $('panel'+TAB_MAP[k]).style.display = k===t?'':'none';
    $('tab'+TAB_MAP[k]).className='tab'+(k===t?' on':'');
  });
  $('tabHint').textContent = TAB_HINT[t] || '';
}

// 当前期号：优先读归档脚本写的 data/latest-period.json，读不到再退回 319
var LATEST_PER=319;
var VIEW_PER=0;              // 0=跟当期；非0=看指定往期
function curPer(){ return VIEW_PER || LATEST_PER; }
function setViewPer(v){ VIEW_PER=parseInt(v,10)||0; try{ loadAll(); }catch(e){} }
function loadPeriods(){
  fetchJson('data/periods.json',6000).then(function(d){
    renderPeriodBar((d&&d.periods)||[LATEST_PER]);
  }).catch(function(){ renderPeriodBar([LATEST_PER]); });
}
function renderPeriodBar(list){
  var el=document.getElementById('periodBar'); if(!el) return;
  if(!list.length) list=[LATEST_PER];
  var opts=list.slice().sort(function(a,b){return b-a;}).map(function(p){
    return '<option value="'+p+'"'+(Number(p)===Number(curPer())?' selected':'')+'>'+p+' 期</option>';
  }).join('');
  el.innerHTML='<span style="color:#666;font-weight:600">期号</span>'
    +'<select id="perSel" onchange="setViewPer(this.value)" style="border:1px solid #ddd;border-radius:6px;padding:5px 8px;font-size:13px;background:#fff">'+opts+'</select>'
    +'<span style="color:#999;font-size:11px">'+(VIEW_PER?(Number(VIEW_PER)<319?'看往期（该期仅存论坛记录）':'看往期，切回最新点右侧按钮'):'当前最新期')+'</span>'
    +(VIEW_PER?'<button onclick="setViewPer(0)" style="border:1px solid #000;background:#fff;border-radius:6px;padding:4px 8px;font-size:12px">回到当期</button>':'');
}
function fetchLatestPeriod(){
  return fetchJson('data/latest-period.json',6000).then(function(d){
    if(d&&d.period){ LATEST_PER=d.period; }
    return LATEST_PER;
  }).catch(function(){ return LATEST_PER; });
}
function loadImg(){
  return fetchLatestPeriod().then(function(){
    var per=curPer();
    return Promise.all([

// 杀肖汇总：各肖被多少准作者杀 / 多少差作者杀
function renderKill(){
  var list=state.authors.filter(function(a){return a.kind==='kill';});
  var goodKill={}, badKill={};
  list.forEach(function(a){
    var s=authorStats(a);
    if(!s.curRow) return;
    s.curRow.zods.forEach(function(z){
      if(s.cls==='good') goodKill[z]=(goodKill[z]||0)+1;
      else if(s.cls==='bad') badKill[z]=(badKill[z]||0)+1;
    });
  });
  var html='<div class="card"><h2>本期杀肖汇总（按作者准确率分）</h2><div class="muted">准的作者杀掉的肖（可参考排除） vs 差的作者杀掉的肖（留意反着看）</div><div class="board" style="margin-top:10px">';
  ZOD.forEach(function(z){
    var g=goodKill[z]||0, b=badKill[z]||0;
    html+='<div class="cell"><div class="z">'+z+'</div><div class="n">准'+g+' / 差'+b+'</div></div>';
  });
  html+='</div></div>';

  // ===== 文字墙（网站推荐）杀肖票数 =====
  var twKillCount = {};
  var twKillCols = 0;
  var twDetails = []; // 栏目明细
  var twSiteSet = {};
  var twOffP = Object.keys(state.official||{}).map(Number);
  var twNext = twOffP.length ? Math.max.apply(null, twOffP) + 1 : null;
  if(state.tw && state.tw.columns){
    state.tw.columns.forEach(function(col){
      if(col.siteNo) twSiteSet[col.siteNo] = 1;
      if(col.title && (col.title.indexOf('杀')>=0 || col.title.indexOf('绝')>=0)){
        if(col.rows && col.rows.length){
          var row = null;
          for(var ri=col.rows.length-1; ri>=0; ri--){
            if(twNext && col.rows[ri].period === twNext){ row = col.rows[ri]; break; }
          }
          if(row && row.zods && row.zods.length){
            twKillCols++;
            twDetails.push({title: col.title, zods: row.zods});
            row.zods.forEach(function(z){
              twKillCount[z] = (twKillCount[z]||0) + 1;
            });
          }
        }
      }
    });
  }
  var twSiteN = Object.keys(twSiteSet).length;
  // 栏目明细（每个栏目杀了哪几个肖）
  html+='<div class="card"><h2>网站推荐杀肖（文字墙栏目明细）</h2><div class="muted">共'+twKillCols+' 个杀肖栏目在 '+(twNext||'当期')+' 期有数据 · 来源站点 '+twSiteN+' 个</div><div style="margin-top:10px">';
  twDetails.forEach(function(d){
    var shortTitle = d.title.replace(/澳门香港大联盟【|】4901996.com/g, '').replace(/澳门大联盟【|】/g, '');
    html+='<div class="row"><span style="font-size:14px">'+esc(shortTitle)+'</span><span>';
    d.zods.forEach(function(z){
      html+='<span class="zod kill" style="margin-left:4px">'+z+'</span>';
    });
    html+='</span></div>';
  });
  if(twDetails.length===0) html+='<div class="muted">本期暂无文字墙杀肖数据</div>';
  html+='</div></div>';

  // 票数汇总
  var twSorted = Object.keys(twKillCount).sort(function(a,b){return twKillCount[b]-twKillCount[a];});
  html+='<div class="card"><h2>网站推荐杀肖票数汇总</h2>'
    +'<div class="muted">'
    +(twSiteN<=1
        ? '来源只有 1 个站点（同站开了多个栏目），票数＝该站自己投自己，<b>不能当多站共识</b>。'
        : '来源 '+twSiteN+' 个站点，票数按栏目计。')
    +'</div><div style="margin-top:10px">';
  twSorted.forEach(function(z){
    var n = twKillCount[z];
    var pct = Math.round(n/Math.max(twKillCols,1)*100);
    var color = n>=3?'#c62828':(n>=2?'#e65100':'#666');
    html+='<div class="row"><span class="zod kill">'+z+'</span><span style="color:'+color+';font-weight:700">'+n+'票（'+pct+'%）</span></div>';
  });
  html+='</div></div>';

  // ===== 论坛杀肖票数 =====
  var forumKillCount = {};
  var forumKillPosts = 0;
  list.forEach(function(a){
    var s = authorStats(a);
    if(s.curRow && s.curRow.zods && (twNext ? s.curRow.period === twNext : true)){
      forumKillPosts++;
      s.curRow.zods.forEach(function(z){
        forumKillCount[z] = (forumKillCount[z]||0) + 1;
      });
    }
  });
  var forumSorted = Object.keys(forumKillCount).sort(function(a,b){return forumKillCount[b]-forumKillCount[a];});
  html+='<div class="card"><h2>论坛杀肖票数</h2><div class="muted">共 '+forumKillPosts+' 个杀肖帖在 '+(twNext||'当期')+' 期有数据（总数 '+list.length+'） · 每条来自不同发布者，各自算 1 票</div><div style="margin-top:10px">';
  forumSorted.forEach(function(z){
    var n = forumKillCount[z];
    var pct = Math.round(n/Math.max(forumKillPosts,1)*100);
    var color = n>=10?'#c62828':(n>=6?'#e65100':'#666');
    html+='<div class="row"><span class="zod kill">'+z+'</span><span style="color:'+color+';font-weight:700">'+n+'票（'+pct+'%）</span></div>';
  });
  if(forumSorted.length===0) html+='<div class="muted">本期暂无论坛杀肖数据（资料还没更新到该期）</div>';
  html+='</div></div>';

  // 作者列表
  var sorted=list.slice().sort(function(x,y){
    var sx=authorStats(x), sy=authorStats(y);
    return (sy.acc||0)-(sx.acc||0);
  });
  html+='<div class="card"><h2>杀肖作者（'+list.length+'）</h2>';
  sorted.forEach(function(a,idx){
    var s=authorStats(a);
    var pct=s.acc!=null?Math.round(s.acc*100)+'%':'—';
    var curTxt=s.curRow?('本期杀：'+s.curRow.zods.join(' ')):'本期暂无';
    html+='<div class="auth" onclick="this.classList.toggle(\'open\')">'
      +'<div class="top"><span class="name">'+esc(a.name)+'</span><span class="tag '+s.cls+'">'+classifyLabel(s.cls)+'</span></div>'
      +'<div class="meta">'+esc(a.topic)+' · 准'+s.hit+' 错'+s.miss+' · 准确率'+pct+'</div>'
      +'<div class="meta">'+curTxt+'</div>'
      +'<div class="bar"><i style="width:'+(s.acc!=null?Math.round(s.acc*100):0)+'%"></i></div>'
      +'<div class="detail">';
    s.periods.slice(0,30).forEach(function(p){
      var r=a.rows[p], j=judgeRow(a.kind,r);
      var jt=j==='hit'?'准':j==='miss'?'错':'待开';
      html+=p+'期 杀['+r.zods.join('')+'] → '+jt+'<br>';
    });
    html+='</div></div>';
  });
  html+='</div>';
  $('panelKill').innerHTML=html;
}

// 栏目命中率排行：所有栏目按命中率从高到低排
function renderRank(){
  var all = [];
  
  // 文字墙栏目
  if(state.tw && state.tw.columns){
    state.tw.columns.forEach(function(col){
      if(col.hit || col.miss){
        var total = col.hit + col.miss;
        var acc = total > 0 ? (col.hit / total * 100).toFixed(1) : 0;
        all.push({
          name: col.title || '未知',
          source: '文字墙',
          kind: col.kind || 'other',
          hit: col.hit || 0,
          miss: col.miss || 0,
          total: total,
          acc: parseFloat(acc),
          cls: col.cls || 'watch'
        });
      }
    });
  }
  
  // 论坛帖子
  if(state.forum && state.forum.columns){
    state.forum.columns.forEach(function(col){
      if(col.hit || col.miss){
        var total = col.hit + col.miss;
        var acc = total > 0 ? (col.hit / total * 100).toFixed(1) : 0;
        all.push({
          name: col.name || '未知',
          source: '论坛',
          kind: col.kind || 'other',
          hit: col.hit || 0,
          miss: col.miss || 0,
          total: total,
          acc: parseFloat(acc),
          cls: col.cls || 'watch'
        });
      }
    });
  }
  
  // 按命中率从高到低排序
  all.sort(function(a, b){ return b.acc - a.acc; });
  
  var html = '';
  
  // 顶部统计
  html += '<div class="card"><h2>栏目命中率排行</h2><div class="muted">共 ' + all.length + ' 个栏目/帖子，按命中率从高到低排</div>';
  if(!all.length){
    html += '<div class="muted" style="margin-top:10px;line-height:1.8">'
      + '已抓到本期 ' + ((state.tw.columns||[]).length + (state.forum.columns||[]).length) + ' 条资料，但还没有一条走完「发布 → 开奖 → 对账」。<br>'
      + '手上只有 317/318 两期的零散回测（48 + 47 条），不够排名。<br>'
      + '从 '+LATEST_PER+' 期起每期自动存档，存满 3 期后此页开始出真实命中率排序。'
      + '</div>';
  }
  html += '<div style="display:flex;gap:12px;margin-top:10px">';
  html += '<div style="flex:1;text-align:center;padding:8px;background:#f0fdf4;border-radius:8px"><div style="font-size:12px;color:#666">准（good）</div><div style="font-size:20px;font-weight:700;color:#16a34a">' + all.filter(function(x){return x.cls==='good';}).length + '</div></div>';
  html += '<div style="flex:1;text-align:center;padding:8px;background:#fffbeb;border-radius:8px"><div style="font-size:12px;color:#666">观察（watch）</div><div style="font-size:20px;font-weight:700;color:#d97706">' + all.filter(function(x){return x.cls==='watch';}).length + '</div></div>';
  html += '<div style="flex:1;text-align:center;padding:8px;background:#fef2f2;border-radius:8px"><div style="font-size:12px;color:#666">差（bad）</div><div style="font-size:20px;font-weight:700;color:#dc2626">' + all.filter(function(x){return x.cls==='bad';}).length + '</div></div>';
  html += '</div></div>';
  
  // 杀肖栏目排行
  var killList = all.filter(function(x){return x.kind === 'kill';});
  if(killList.length){
    html += '<div class="card" style="margin-top:12px"><h2>🔪 杀肖栏目排行（' + killList.length + '个）</h2>';
    html += '<div style="margin-top:10px">';
    killList.forEach(function(item, idx){
      var color = item.acc >= 80 ? '#16a34a' : item.acc >= 60 ? '#d97706' : '#dc2626';
      html += '<div style="display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0">';
      html += '<div style="width:24px;font-weight:700;color:#999">' + (idx+1) + '</div>';
      html += '<div style="flex:1;font-size:13px">' + item.name + '</div>';
      html += '<div style="font-size:12px;color:#666;margin:0 12px">中' + item.hit + ' · 错' + item.miss + '</div>';
      html += '<div style="width:60px;text-align:right;font-weight:700;color:' + color + '">' + item.acc + '%</div>';
      html += '</div>';
    });
    html += '</div></div>';
  }
  
  // 推荐肖栏目排行
  var recList = all.filter(function(x){return x.kind === 'rec';});
  if(recList.length){
    html += '<div class="card" style="margin-top:12px"><h2>🎯 推荐肖栏目排行（' + recList.length + '个）</h2>';
    html += '<div style="margin-top:10px">';
    recList.forEach(function(item, idx){
      var color = item.acc >= 80 ? '#16a34a' : item.acc >= 60 ? '#d97706' : '#dc2626';
      html += '<div style="display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0">';
      html += '<div style="width:24px;font-weight:700;color:#999">' + (idx+1) + '</div>';
      html += '<div style="flex:1;font-size:13px">' + item.name + '</div>';
      html += '<div style="font-size:12px;color:#666;margin:0 12px">中' + item.hit + ' · 错' + item.miss + '</div>';
      html += '<div style="width:60px;text-align:right;font-weight:700;color:' + color + '">' + item.acc + '%</div>';
      html += '</div>';
    });
    html += '</div></div>';
  }
  
  $('panelRank').innerHTML = html;
}

function ballColor(n){
  var red=[1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46];
  var blue=[3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48];
  if(red.indexOf(n)>=0) return '#e74c3c';
  if(blue.indexOf(n)>=0) return '#3498db';
  return '#27ae60';
}

// 读 data/periods.json + 每期 archive-report，列出归档摘要
function loadArchiveList(){
  fetchJson('data/periods.json',6000).then(function(d){
    var list=((d&&d.periods)||[]).slice().sort(function(a,b){return b-a;});   // 新期在前
    if(!list.length){ var el=document.getElementById('hotArchive'); if(el) el.innerHTML='<span class="muted">还没有存档</span>'; return; }
    return Promise.all(list.slice(0,12).map(function(pr){
      return fetchJson('data/archive-report-'+pr+'.json',6000).then(function(r){ return {p:pr,r:r}; }).catch(function(){ return {p:pr,r:null}; });
    }));
  }).then(function(rows){
    var el=document.getElementById('hotArchive'); if(!el) return;
    if(!rows||!rows.length){ el.innerHTML='<span class="muted">还没有存档</span>'; return; }
    var h='';
    rows.forEach(function(x){
      var r=x.r||{};
      var tplN=r.tplRank&&r.tplRank.length? (r.tplRank.reduce(function(a,b){return a+((b.totalTpl)||0);},0)) : 0;
      var sw='';
      if(Number(x.p)===Number(curPer())) sw='<span style="font-size:11px;color:#c0392b;border:1px solid #c0392b;border-radius:8px;padding:0 5px;margin-left:5px">正在看</span>';
      h+='<div onclick="setViewPer('+x.p+')" style="display:flex;justify-content:space-between;align-items:center;padding:7px 4px;border-bottom:1px solid #f0f0f0;cursor:pointer">'
        +'<span><b style="font-size:15px">'+x.p+' 期</b>'+sw+'</span>'
        +'<span style="font-size:12px;color:#666;text-align:right;line-height:1.6">'
        +'帖 '+(r.deduped!=null?r.deduped:'—')+' · 推 '+(r.sumRec!=null?r.sumRec:'—')+' · 杀 '+(r.sumKill!=null?r.sumKill:'—')
        +'<br>模板 '+(tplN||'—')+' · '+(r.fetched!=null?('抓 '+(r.fetched)+' 帖'):'')
        +'</span></div>';
    });
    el.innerHTML=h+'<div class="muted" style="margin-top:6px;font-size:11px">只列最近 12 期；需要更早的，把期号给我单独调出来</div>';
  }).catch(function(){
    var el=document.getElementById('hotArchive'); if(el) el.innerHTML='<span class="muted">存档索引读不到</span>';
  });
}

function esc(s){ return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

// 总览：来源、资料数量、分类计数、本期主推第一肖累计
function renderOverview(){
  // ===== 本期结论（最显眼，放在最前面） =====
  var ZOD = ['马','蛇','龙','兔','虎','牛','鼠','猪','狗','鸡','猴','羊'];
  
  // 获取最新期号
  var latestPeriod = '';
  if(state.official){
    var periods = Object.keys(state.official);
    if(periods.length > 0){
      latestPeriod = Math.max.apply(null, periods) + '期';
    }
  }
  
  // 下一期（正在收注的那期）：共识只对下一期有意义
  var nextPeriod = parseInt(latestPeriod, 10) ? parseInt(latestPeriod, 10) + 1 : '';

  // ===== 1. 文字墙杀肖统计（只取与下一期同期的行；文字墙滞后就标出来，不用旧期冒充） =====
  var twKillVote = {};
  for(var i=0; i<ZOD.length; i++){ twKillVote[ZOD[i]] = 0; }
  var twKillTotal = 0;
  var twStaleCols = 0, twStaleLatest = 0;
  var twSiteSet = {};
  var twAllCols = (state.tw && state.tw.columns) || [];
  twAllCols.forEach(function(c){ if(c.siteNo) twSiteSet[c.siteNo] = 1; });

  for(var j=0; j<twAllCols.length; j++){
    var col = twAllCols[j];
    if(col.kind !== 'kill' || !col.rows || !col.rows.length) continue;
    var rowMatch = null;
    for(var r=col.rows.length-1; r>=0; r--){
      if(col.rows[r] && col.rows[r].period === nextPeriod){ rowMatch = col.rows[r]; break; }
    }
    if(!rowMatch){
      twStaleCols++;
      var maxP = 0;
      col.rows.forEach(function(rr){ if(rr.period && rr.period > maxP) maxP = rr.period; });
      if(maxP > twStaleLatest) twStaleLatest = maxP;
      continue;
    }
    if(rowMatch.zods && rowMatch.zods.length){
      twKillTotal++;
      for(var k=0; k<rowMatch.zods.length; k++){
        var z = rowMatch.zods[k];
        if(twKillVote[z] !== undefined) twKillVote[z]++;
      }
    }
  }
  var twSiteCount = Object.keys(twSiteSet).length;
  
  // 文字墙按票数排序
  var twArr = [];
  for(var tz in twKillVote){
    twArr.push({z: tz, n: twKillVote[tz]});
  }
  twArr.sort(function(a,b){ return b.n - a.n; });
  
  // ===== 2. 论坛杀肖统计（只取与下一期同期；不同发布者，才算独立票） =====
  var forumKillVote = {};
  for(var f=0; f<ZOD.length; f++){ forumKillVote[ZOD[f]] = 0; }
  var forumKillTotal = 0;
  var forumStaleCols = 0;

  if(state.forum && state.forum.columns){
    for(var m=0; m<state.forum.columns.length; m++){
      var fcol = state.forum.columns[m];
      if(fcol.kind !== 'kill' || !fcol.current || !fcol.current.zods) continue;
      if(nextPeriod && fcol.current.period == nextPeriod){
        forumKillTotal++;
        for(var n=0; n<fcol.current.zods.length; n++){
          var fz = fcol.current.zods[n];
          if(forumKillVote[fz] !== undefined) forumKillVote[fz]++;
        }
      } else {
        forumStaleCols++;
      }
    }
  }
  
  // 论坛按票数排序
  var forumArr = [];
  for(var fzname in forumKillVote){
    forumArr.push({z: fzname, n: forumKillVote[fzname]});
  }
  forumArr.sort(function(a,b){ return b.n - a.n; });
  
  var html = '';

  // ===== 本期结论总卡片 =====
  html += '<div class="card" style="border:2px solid #333">';
  html += '<h2 style="text-align:center">'+(nextPeriod||latestPeriod)+' 期杀肖共识</h2>';
  html += '<div class="muted" style="text-align:center;margin-bottom:12px">只统计已更新到该期的资料；来源标注见每块下方</div>';

  // --- 文字墙（单一站点自投票） ---
  html += '<div style="margin:15px 0">';
  html += '<div style="font-weight:700;font-size:16px;margin-bottom:8px">文字墙（独立站点 '+twSiteCount+' 个 · 本期 '+twKillTotal+' 个栏目）</div>';
  if(twKillTotal === 0){
    html += '<div style="background:#fff4f4;padding:10px;border-radius:8px;color:#c62828;font-size:14px;line-height:1.6">'
      + '该源未更新到 '+(nextPeriod||'当期')+' 期'+(twStaleLatest?('（最新只到 '+twStaleLatest+' 期）'):'')
      + '，本期不参与统计，避免用旧期充数。</div>';
  } else {
  html += '<div style="background:#f8f9fa;padding:10px;border-radius:8px">';
  if(twSiteCount <= 1){
    html += '<div style="color:#c62828;font-size:13px;margin-bottom:6px">注意：这 '+twKillTotal+' 个栏目全部来自同 1 个站点，属于该站自己开多个栏目投票，不能当「多站共识」使用。</div>';
  }
  
  // 文字墙Top3杀得最多的
  var twTop3 = twArr.slice(0, 3);
  html += '<div style="color:#dc2626;font-size:14px;margin-bottom:5px">杀得最多：</div>';
  for(var tt=0; tt<twTop3.length; tt++){
    var titem = twTop3[tt];
    if(titem.n > 0){
      var tpct = twKillTotal > 0 ? Math.round(titem.n/twKillTotal*100) : 0;
      html += '<div style="margin:3px 0 3px 10px;font-size:14px">'+titem.z+' - '+titem.n+'票 ('+tpct+'%)</div>';
    }
  }
  html += '</div>';
  }
  html += '</div>';

  // --- 论坛（不同发布者，才算票） ---
  html += '<div style="margin:15px 0">';
  html += '<div style="font-weight:700;font-size:16px;margin-bottom:8px">论坛（不同发布者 '+forumKillTotal+' 个帖子）</div>';
  if(forumKillTotal === 0){
    html += '<div style="background:#fff4f4;padding:10px;border-radius:8px;color:#c62828;font-size:14px;line-height:1.6">'
      + '论坛资料还未更新到 '+(nextPeriod||'当期')+' 期（'+forumStaleCols+' 个栏目仍是旧期），本期不参与统计。</div>'
      + '</div>';
  } else {
  html += '<div style="background:#f8f9fa;padding:10px;border-radius:8px">';
  html += '<div style="color:#666;font-size:13px;margin-bottom:6px">来源：公开论坛不同作者各自发的帖，每人算 1 票；比单站多栏目自投票更接近「多方意见」。</div>';

  // 论坛Top3杀得最多的
  var forumTop3 = forumArr.slice(0, 3);
  html += '<div style="color:#dc2626;font-size:14px;margin-bottom:5px">杀得最多：</div>';
  for(var ft=0; ft<forumTop3.length; ft++){
    var fitem = forumTop3[ft];
    if(fitem.n > 0){
      var fpct = forumKillTotal > 0 ? Math.round(fitem.n/forumKillTotal*100) : 0;
      html += '<div style="margin:3px 0 3px 10px;font-size:14px">'+fitem.z+' - '+fitem.n+'票 ('+fpct+'%)</div>';
    }
  }
  html += '</div>';
  }
  html += '</div>';

  html += '</div>';
  
  // ===== 下面是原来的详细统计 =====
  var auth=state.authors;
  var kill=auth.filter(function(a){return a.kind==='kill';});
  var rec=auth.filter(function(a){return a.kind.indexOf('rec')===0;});
  function cnt(list,cls){ return list.filter(function(a){return authorStats(a).cls===cls;}).length; }
  var gK=cnt(kill,'good'), bK=cnt(kill,'bad'), wK=cnt(kill,'watch');
  var gR=cnt(rec,'good'), bR=cnt(rec,'bad'), wR=cnt(rec,'watch');
  var typeCount={rec9:0,rec6:0,rec5:0,rec4:0,rec3:0};
  rec.forEach(function(a){ typeCount[a.kind]=(typeCount[a.kind]||0)+1; });
  var firstCount={};
  rec.forEach(function(a){ var s=authorStats(a); if(s.curRow&&s.curRow.zods[0]) firstCount[s.curRow.zods[0]]=(firstCount[s.curRow.zods[0]]||0)+1; });
  var offN=Object.keys(state.official).length;

  html+='<div class="card"><h2>详细统计</h2>'
    +'<div class="row"><span>接入数据源</span><span>2 类（公开论坛 + 文字墙联盟站）</span></div>'
    +'<div class="row"><span>论坛独立发布者</span><span>'+auth.length+' 个</span></div>'
    +'<div class="row"><span>文字墙独立站点</span><span>'+twSiteCount+' 个（'+((state.tw&&state.tw.columns)||[]).length+' 个栏目）</span></div>'
    +'<div class="row"><span>已对账官方开奖</span><span>'+offN+' 期</span></div>'
    +'<div class="muted" style="margin-top:6px">票数按「独立来源」计：论坛一条帖算 1 票，文字墙同一站点的多个栏目只算 1 个来源，不能当多站共识。</div></div>';

  html+='<div class="card"><h2>资料数量</h2>'
    +'<div class="row"><span>资料总数（发布者）</span><span>'+auth.length+' 份</span></div>'
    +'<div class="row"><span>杀肖资料</span><span>'+kill.length+' 份</span></div>'
    +'<div class="row"><span>推荐肖资料</span><span>'+rec.length+' 份</span></div>'
    +'<div class="row"><span>　九肖 / 六肖</span><span>'+typeCount.rec9+' / '+typeCount.rec6+'</span></div>'
    +'<div class="row"><span>　五肖 / 四肖 / 三肖</span><span>'+typeCount.rec5+' / '+typeCount.rec4+' / '+typeCount.rec3+'</span></div></div>';

  html+='<div class="card"><h2>分类统计（对照特肖）</h2>'
    +'<div class="row"><span>准的（对多错少）</span><span>杀 '+gK+' · 推荐 '+gR+' · 合计 '+(gK+gR)+'</span></div>'
    +'<div class="row"><span>差的（错多对少）</span><span>杀 '+bK+' · 推荐 '+bR+' · 合计 '+(bK+bR)+'</span></div>'
    +'<div class="row"><span>观察（样本不足）</span><span>杀 '+wK+' · 推荐 '+wR+' · 合计 '+(wK+wR)+'</span></div></div>';

  var twCols=state.tw.columns||[];
  var twKill=twCols.filter(function(c){return c.kind==='kill';}).length;
  var twRec=twCols.filter(function(c){return c.kind==='rec';}).length;
  var twOth=twCols.filter(function(c){return c.kind==='other';}).length;
  var twG=twCols.filter(function(c){return c.cls==='good';}).length;
  var twB=twCols.filter(function(c){return c.cls==='bad';}).length;
  var twW=twCols.filter(function(c){return c.cls==='watch';}).length;
  var twMm=twCols.filter(function(c){return (c.mismatch||[]).length>0;}).length;
  html+='<div class="card"><h2>文字墙栏目</h2>'
    +'<div class="row"><span>栏目数</span><span>'+twCols.length+'（杀 '+twKill+' / 推荐 '+twRec+' / 其他 '+twOth+'）</span></div>'
    +'<div class="row"><span>分类</span><span>准 '+twG+' · 差 '+twB+' · 观察 '+twW+'</span></div>'
    +'<div class="row"><span>自标不符栏目</span><span>'+twMm+'</span></div>'
    +'<div class="muted" style="margin-top:6px">明细与来源链接见「文字墙」标签页。</div></div>';

  var fCols=state.forum.columns||[];
  var fKill=fCols.filter(function(c){return c.kind==='kill';}).length;
  var fRec=fCols.filter(function(c){return c.kind==='rec';}).length;
  var fG=fCols.filter(function(c){return c.cls==='good';}).length;
  var fB=fCols.filter(function(c){return c.cls==='bad';}).length;
  var fW=fCols.filter(function(c){return c.cls==='watch';}).length;
  var fMm=fCols.filter(function(c){return c.mismatchCount>0;}).length;
  html+='<div class="card"><h2>论坛帖（后台对账）</h2>'
    +'<div class="row"><span>帖子数</span><span>'+fCols.length+'（杀 '+fKill+' / 推荐 '+fRec+'）</span></div>'
    +'<div class="row"><span>分类</span><span>准 '+fG+' · 差 '+fB+' · 观察 '+fW+'</span></div>'
    +'<div class="row"><span>自标不符帖</span><span>'+fMm+'</span></div>'
    +'<div class="muted" style="margin-top:6px">明细、来源接口与指纹见「论坛」标签页；全量逐期明细存 forum-snapshot.json。</div></div>';

  // 优先只算判为「准的」的栏目；一条都没对账时退化成全体计入，并标明口径
  var hasGood=false;
  fCols.forEach(function(c){ if(c.cls==='good') hasGood=true; });
  twCols.forEach(function(c){ if(c.cls==='good') hasGood=true; });

  var goodRecFirst={}, goodKillVote={};
  fCols.forEach(function(c){
    if(hasGood && c.cls!=='good') return;
    var z=(c.current||{}).zods||[];
    if(c.kind==='rec' && z[0]) goodRecFirst[z[0]]=(goodRecFirst[z[0]]||0)+1;
    if(c.kind==='kill') z.forEach(function(x){ goodKillVote[x]=(goodKillVote[x]||0)+1; });
  });
  twCols.forEach(function(c){
    if(hasGood && c.cls!=='good') return;
    var rows=c.rows||[]; var z=(rows[rows.length-1]||{}).zods||[];
    if(c.kind==='rec' && z[0]) goodRecFirst[z[0]]=(goodRecFirst[z[0]]||0)+1;
    if(c.kind==='kill') z.forEach(function(x){ goodKillVote[x]=(goodKillVote[x]||0)+1; });
  });

  var recTitle = hasGood ? '本期主推共识（只算准的）' : '本期主推共识（全体计入）';
  var recNote = hasGood
    ? '扣完缺更后判为「准的」的推荐帖，列表排第一的肖被提到次数；差的帖不再混入'
    : '一条都还没走完「发布→开奖→对账」，暂按全部资料统计；等有对账结果后会自动只留准的。';
  html+='<div class="card"><h2>'+recTitle+'</h2><div class="muted">'+recNote+'</div><div class="board" style="margin-top:10px">';
  ZOD.forEach(function(z){
    var n=goodRecFirst[z]||0;
    html+='<div class="cell"><div class="z">'+z+'</div><div class="n">'+n+'票</div></div>';
  });
  html+='</div></div>';

  html+='<div class="card"><h2>'+(hasGood?'本期杀肖共识（避开）':'本期杀肖共识（全体计入）')+'</h2><div class="muted">'+(hasGood?'准的杀肖资料本期要杀的肖，票数越多越该避开':'尚未对账，暂按全部杀肖资料统计；票数越多越该避开')+'</div><div class="board" style="margin-top:10px">';
  ZOD.forEach(function(z){
    var n=goodKillVote[z]||0;
    html+='<div class="cell"><div class="z">'+z+'</div><div class="n">'+n+'票</div></div>';
  });
  html+='</div></div>';
  $('panelOverview').innerHTML=html;
}

    +'· <b style="color:#777">观察（灰色）</b>：样本不足10期，还看不出规律<br>'

  html+='<div class="card"><h2>数据来源</h2><div style="line-height:1.8;font-size:14px">'
    +'· 联盟站文字墙（4901996等站点各栏目）<br>'
    +'· 公开论坛各作者发帖<br>'
    +'· 官方开奖结果（自动对账）<br>'
    +'<br><span class="muted">只采集新澳门彩数据，香港彩、快乐8不采集。</span></div></div>';

  html+='<div class="muted" style="line-height:1.6">注：以上均为历史数据统计，开奖为随机事件，过往命中率不代表以后结果，仅供参考。</div>';
  $('panelDoc').innerHTML=html;
}

function saveSnapshot(){
  state.fetchedAt=new Date().toLocaleString('zh-CN');
  try{ localStorage.setItem(LS_KEY, JSON.stringify({authors:state.authors, fetchedAt:state.fetchedAt})); }catch(e){}

function loadSnapshot(){
  try{
    var s=JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if(s&&s.authors){ state.authors=s.authors; state.fetchedAt=s.fetchedAt||''; return true; }
  }catch(e){}
  return false;
}
