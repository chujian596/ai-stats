<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>六合AI分析 - 多站共识系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;color:#222;font-size:15px}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:16px 16px 12px}
.header h1{font-size:18px;font-weight:700}
.header .sub{font-size:12px;color:#8899aa;margin-top:4px}
.period-bar{background:#fff;margin:10px;padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.period-bar .issue{font-size:24px;font-weight:700;color:#1a1a2e}
.period-bar .time{font-size:13px;color:#888}
.section{margin:10px;background:#fff;border-radius:10px;overflow:hidden}
.section-title{padding:12px 14px;font-weight:700;font-size:15px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.section-title .tag{font-size:11px;font-weight:400;color:#888;background:#f5f5f5;padding:2px 8px;border-radius:10px}
.section-body{padding:12px 14px}
.zodiac-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.zodiac-card{padding:10px;text-align:center;border-radius:8px;border:2px solid #eee;position:relative}
.zodiac-card .zname{font-size:18px;font-weight:700}
.zodiac-card .zcount{font-size:11px;color:#888;margin-top:2px}
.zodiac-card.kill-heavy{border-color:#ff4444;background:#fff5f5}
.zodiac-card.kill-light{border-color:#ffaa44;background:#fffbf0}
.zodiac-card.hot{border-color:#44aa44;background:#f0fff0}
.zodiac-card.cold{border-color:#888;background:#f8f8f8}
.bar-chart{margin:8px 0}
.bar-row{display:flex;align-items:center;margin:4px 0;font-size:13px}
.bar-row .label{width:50px;text-align:right;padding-right:8px;color:#555}
.bar-row .bar-wrap{flex:1;height:20px;background:#f0f0f0;border-radius:4px;overflow:hidden}
.bar-row .bar{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:6px;font-size:11px;color:#fff;font-weight:600}
.bar-row .value{width:40px;text-align:left;padding-left:6px;font-weight:600}
.analysis-text{font-size:14px;line-height:1.8;color:#333}
.analysis-text strong{color:#1a1a2e}
.verdict{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);padding:14px;border-radius:8px;margin:10px;font-size:14px;line-height:1.8}
.verdict.warn{background:linear-gradient(135deg,#fff3e0,#ffe0b2)}
.site-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.site-chip{padding:4px 10px;background:#f0f2f5;border-radius:14px;font-size:12px;color:#555}
.site-chip.best{background:#c8e6c9;color:#2e7d32;font-weight:600}
.tabs{display:flex;background:#fff;margin:0 10px;border-radius:10px;overflow:hidden}
.tab{flex:1;padding:10px;text-align:center;font-size:13px;cursor:pointer;color:#888;border-bottom:2px solid transparent}
.tab.active{color:#1a1a2e;font-weight:700;border-bottom-color:#e63946}
</style>
</head>
<body>

<div class="header">
  <h1>六合AI分析</h1>
  <div class="sub">49站共识 · 历史回测 · 自动统计</div>
</div>

<div class="period-bar">
  <div>
    <div class="issue">第316期</div>
    <div class="time">新澳门六合彩 · 今晚21:32开奖</div>
  </div>
  <div style="text-align:right">
    <div style="font-size:13px;color:#888">315期开奖</div>
    <div style="font-weight:700">06牛 09狗 25马 27龙 33狗 22鸡 + 48羊</div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('consensus')">多站共识</div>
  <div class="tab" onclick="showTab('frequency')">冷热分析</div>
  <div class="tab" onclick="showTab('sites')">站点排名</div>
</div>

<div id="tab-consensus" class="tab-content">
  <div class="section">
    <div class="section-title">杀肖共识 <span class="tag">被越多站杀=越不可能开</span></div>
    <div class="section-body">
      <div class="zodiac-grid" id="killGrid"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">AI综合判断</div>
    <div class="section-body">
      <div class="analysis-text" id="aiText"></div>
      <div class="verdict" id="verdict"></div>
    </div>
  </div>
</div>

<div id="tab-frequency" class="tab-content" style="display:none">
  <div class="section">
    <div class="section-title">近20期特肖频率 <span class="tag">热号vs冷号</span></div>
    <div class="section-body" id="freqChart"></div>
  </div>
</div>

<div id="tab-sites" class="tab-content" style="display:none">
  <div class="section">
    <div class="section-title">站点命中率排名 <span class="tag">历史回测</span></div>
    <div class="section-body" id="siteRanking"></div>
  </div>
</div>

<script>
// 数据
const KILL_DATA = {"牛":8,"羊":7,"猪":7,"鸡":6,"狗":6,"猴":6,"鼠":5,"蛇":5,"马":5,"龙":4,"虎":3,"兔":1};
const FREQ_DATA = {"蛇":3,"鸡":3,"猴":2,"马":2,"虎":2,"狗":2,"鼠":2,"猪":1,"龙":1,"牛":1,"羊":1,"兔":0};
const SITE_STATS = [
  {id:"15087",kill3:{hit:19,miss:0},kill6:{hit:7,miss:0}},
  {id:"49874",kill3:{hit:18,miss:0},kill6:{hit:0,miss:0}},
  {id:"0491",kill3:{hit:16,miss:0},kill6:{hit:0,miss:0}},
  {id:"13072",kill3:{hit:16,miss:0},kill6:{hit:0,miss:0}},
  {id:"13357",kill3:{hit:16,miss:0},kill6:{hit:7,miss:0}},
  {id:"338444",kill3:{hit:12,miss:0},kill6:{hit:7,miss:0}},
  {id:"49241",kill3:{hit:11,miss:0},kill6:{hit:0,miss:0}},
  {id:"19016",kill3:{hit:10,miss:0},kill6:{hit:0,miss:0}},
  {id:"13069",kill3:{hit:9,miss:0},kill6:{hit:7,miss:0}},
  {id:"13087",kill3:{hit:9,miss:0},kill6:{hit:7,miss:0}},
];

// 渲染杀肖网格
const killGrid = document.getElementById('killGrid');
const sortedKill = Object.entries(KILL_DATA).sort((a,b)=>b[1]-a[1]);
sortedKill.forEach(([z,count])=>{
  let cls = 'zodiac-card';
  if(count >= 7) cls += ' kill-heavy';
  else if(count >= 4) cls += ' kill-light';
  killGrid.innerHTML += `<div class="${cls}"><div class="zname">${z}</div><div class="zcount">${count}站杀</div></div>`;
});

// AI分析文字
const heavyKill = sortedKill.filter(x=>x[1]>=7).map(x=>x[0]);
const lightKill = sortedKill.filter(x=>x[1]<=2).map(x=>x[0]);
const hotZods = Object.entries(FREQ_DATA).filter(x=>x[1]>=2).map(x=>x[0]);
const coldZods = Object.entries(FREQ_DATA).filter(x=>x[1]===0).map(x=>x[0]);

document.getElementById('aiText').innerHTML = `
<p><strong>多站共识杀肖：</strong>${heavyKill.join('、')}（被7站以上同时杀）</p>
<p><strong>少站关注：</strong>${lightKill.join('、')}（只有1-2站在杀，相对安全）</p>
<p><strong>近期热肖：</strong>${hotZods.join('、')}（近20期出现2次以上）</p>
<p><strong>近期冷肖：</strong>${coldZods.join('、')}（近20期未开出）</p>
<p style="margin-top:8px;color:#666;font-size:13px">说明：杀肖类栏目随机命中率约75%（杀3个肖=排除3/12=25%），49站共识可过滤掉随机噪声。</p>
`;

document.getElementById('verdict').innerHTML = `
<strong>316期综合判断：</strong><br>
最不可能开的肖：<strong>${heavyKill.slice(0,4).join('、')}</strong><br>
相对看好的肖：<strong>${lightKill.join('、')}</strong>（少站杀+冷号回补）<br>
建议关注：${lightKill.filter(z=>hotZods.includes(z)).join('、') || '无明显交叉'}（少站杀+近期热）
`;

// 频率图
const freqChart = document.getElementById('freqChart');
const maxFreq = Math.max(...Object.values(FREQ_DATA));
Object.entries(FREQ_DATA).sort((a,b)=>b[1]-a[1]).forEach(([z,c])=>{
  const pct = c/maxFreq*100;
  const color = c>=2 ? '#4caf50' : c===0 ? '#999' : '#ff9800';
  freqChart.innerHTML += `<div class="bar-row">
    <div class="label">${z}</div>
    <div class="bar-wrap"><div class="bar" style="width:${pct}%;background:${color}">${c}</div></div>
    <div class="value">${c}次</div>
  </div>`;
});

// 站点排名
const siteRanking = document.getElementById('siteRanking');
siteRanking.innerHTML = '<div class="site-list">';
SITE_STATS.forEach((s,i)=>{
  const total = s.kill3.hit+s.kill3.miss;
  const pct = total ? (s.kill3.hit/total*100).toFixed(0) : 0;
  const cls = i<3 ? 'best' : '';
  siteRanking.innerHTML += `<div class="site-chip ${cls}">#${i+1} ${s.id} ${pct}%(${total}期)</div>`;
});
siteRanking.innerHTML += '</div>';

function showTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active', ['consensus','frequency','sites'][i]===name);
  });
  document.querySelectorAll('.tab-content').forEach(t=>t.style.display='none');
  document.getElementById('tab-'+name).style.display='block';
}
</script>
</body>
</html>
