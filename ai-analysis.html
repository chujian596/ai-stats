<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>六合AI分析 - 多站共识系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;color:#222;font-size:15px}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:16px 16px 12px}
.header h1{font-size:18px;font-weight:700}
.header .sub{font-size:12px;color:#8899aa;margin-top:4px}
.period-bar{background:#fff;margin:10px;padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.period-bar .issue{font-size:24px;font-weight:700;color:#1a1a2e}
.period-bar .time{font-size:13px;color:#888}
.section{margin:10px;background:#fff;border-radius:10px;overflow:hidden}
.section-title{padding:12px 14px;font-weight:700;font-size:15px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.section-title .tag{font-size:11px;font-weight:400;color:#888;background:#f5f5f5;padding:2px 8px;border-radius:10px}
.section-body{padding:12px 14px}
.zodiac-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.zodiac-card{padding:10px;text-align:center;border-radius:8px;border:2px solid #eee;position:relative}
.zodiac-card .zname{font-size:18px;font-weight:700}
.zodiac-card .zcount{font-size:11px;color:#888;margin-top:2px}
.zodiac-card.kill-heavy{border-color:#ff4444;background:#fff5f5}
.zodiac-card.kill-light{border-color:#ffaa44;background:#fffbf0}
.zodiac-card.hot{border-color:#44aa44;background:#f0fff0}
.zodiac-card.cold{border-color:#888;background:#f8f8f8}
.bar-chart{margin:8px 0}
.bar-row{display:flex;align-items:center;margin:4px 0;font-size:13px}
.bar-row .label{width:50px;text-align:right;padding-right:8px;color:#555}
.bar-row .bar-wrap{flex:1;height:20px;background:#f0f0f0;border-radius:4px;overflow:hidden}
.bar-row .bar{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:6px;font-size:11px;color:#fff;font-weight:600}
.bar-row .value{width:40px;text-align:left;padding-left:6px;font-weight:600}
.analysis-text{font-size:14px;line-height:1.8;color:#333}
.analysis-text strong{color:#1a1a2e}
.verdict{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);padding:14px;border-radius:8px;margin:10px;font-size:14px;line-height:1.8}
.verdict.warn{background:linear-gradient(135deg,#fff3e0,#ffe0b2)}
.site-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.site-chip{padding:4px 10px;background:#f0f2f5;border-radius:14px;font-size:12px;color:#555}
.site-chip.best{background:#c8e6c9;color:#2e7d32;font-weight:600}
.tabs{display:flex;background:#fff;margin:0 10px;border-radius:10px;overflow:hidden}
.tab{flex:1;padding:10px;text-align:center;font-size:13px;cursor:pointer;color:#888;border-bottom:2px solid transparent}
.tab.active{color:#1a1a2e;font-weight:700;border-bottom-color:#e63946}
</style>
</head>
<body>

<div class="header">
  <h1>六合AI分析</h1>
  <div class="sub" id="aiSub">49站共识 · 历史回测 · 自动统计</div>
</div>

<div class="period-bar">
  <div>
    <div class="issue" id="pbIssue">第318期</div>
    <div class="time" id="pbTime">新澳门六合彩 · 今晚21:32开奖</div>
  </div>
  <div style="text-align:right">
    <div style="font-size:13px;color:#888" id="pbLastLabel">317期开奖</div>
    <div style="font-weight:700" id="pbLastNums">31鼠 49马 30牛 22鸡 43鼠 24羊 + 26蛇</div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('consensus')">多站共识</div>
  <div class="tab" onclick="showTab('frequency')">冷热分析</div>
  <div class="tab" onclick="showTab('sites')">站点排名</div>
</div>

<div id="tab-consensus" class="tab-content">
  <div class="section">
    <div class="section-title">杀肖共识 <span class="tag" id="consensusTag">被越多站杀=越不可能开</span></div>
    <div class="section-body">
      <div class="zodiac-grid" id="killGrid"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">AI综合判断</div>
    <div class="section-body">
      <div class="analysis-text" id="aiText"></div>
      <div class="verdict" id="verdict"></div>
    </div>
  </div>
</div>

<div id="tab-frequency" class="tab-content" style="display:none">
  <div class="section">
    <div class="section-title">近20期特肖频率 <span class="tag" id="freqTag">热号vs冷号</span></div>
    <div class="section-body" id="freqChart"></div>
  </div>
</div>

<div id="tab-sites" class="tab-content" style="display:none">
  <div class="section">
    <div class="section-title">站点命中率排名 <span class="tag" id="siteTag">历史回测</span></div>
    <div class="section-body" id="siteRanking"></div>
  </div>
</div>

<script>
// 数据（兜底静态值；加载成功后按当期重算）
var KILL_DATA = {"牛":8,"羊":7,"猪":7,"鸡":6,"狗":6,"猴":6,"鼠":5,"蛇":5,"马":5,"龙":4,"虎":3,"兔":1};
var FREQ_DATA = {"蛇":3,"鸡":3,"猴":2,"马":2,"虎":2,"狗":2,"鼠":2,"猪":1,"龙":1,"牛":1,"羊":1,"兔":0};
var SITE_STATS = [
  {id:"15087",kill3:{hit:19,miss:0},kill6:{hit:7,miss:0}},
  {id:"49874",kill3:{hit:18,miss:0},kill6:{hit:0,miss:0}},
  {id:"0491",kill3:{hit:16,miss:0},kill6:{hit:0,miss:0}},
  {id:"13072",kill3:{hit:16,miss:0},kill6:{hit:0,miss:0}},
  {id:"13357",kill3:{hit:16,miss:0},kill6:{hit:7,miss:0}},
  {id:"338444",kill3:{hit:12,miss:0},kill6:{hit:7,miss:0}},
  {id:"49241",kill3:{hit:11,miss:0},kill6:{hit:0,miss:0}},
  {id:"19016",kill3:{hit:10,miss:0},kill6:{hit:0,miss:0}},
  {id:"13069",kill3:{hit:9,miss:0},kill6:{hit:7,miss:0}},
  {id:"13087",kill3:{hit:9,miss:0},kill6:{hit:7,miss:0}},
];
var ZODIAC = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
var CORE_INFO = {sites:0, den:0};
var NEXT_ISSUE = 323;
var HEAVY_KILL=[], LIGHT_KILL=[], HOT=[], COLD=[];

function renderKill(){
  var grid=document.getElementById('killGrid'); if(!grid) return;
  var sorted=Object.entries(KILL_DATA).sort(function(a,b){return b[1]-a[1]});
  grid.innerHTML='';
  sorted.forEach(function(x){
    var z=x[0], count=x[1], cls='zodiac-card';
    if(count>=7) cls+=' kill-heavy'; else if(count>=4) cls+=' kill-light';
    grid.innerHTML += '<div class="'+cls+'"><div class="zname">'+z+'</div><div class="zcount">'+count+'站杀</div></div>';
  });
}

function renderAI(){
  var sorted=Object.entries(KILL_DATA).sort(function(a,b){return b[1]-a[1]});
  HEAVY_KILL=sorted.filter(function(x){return x[1]>=7}).map(function(x){return x[0]});
  if(HEAVY_KILL.length<2) HEAVY_KILL=sorted.slice(0,3).map(function(x){return x[0]});
  LIGHT_KILL=sorted.slice(-3).map(function(x){return x[0]});
  HOT=Object.entries(FREQ_DATA).filter(function(x){return x[1]>=2}).map(function(x){return x[0]});
  COLD=Object.entries(FREQ_DATA).filter(function(x){return x[1]===0}).map(function(x){return x[0]});
  var den=CORE_INFO.den || CORE_INFO.sites || 0;
  document.getElementById('aiText').innerHTML = `
<p><strong>多站共识杀肖：</strong>${HEAVY_KILL.join('、')}（被7站以上同时杀）</p>
<p><strong>少站关注：</strong>${LIGHT_KILL.join('、')}（共识最少的三个肖，相对安全）</p>
<p><strong>近期热肖：</strong>${HOT.join('、') || '无'}（近20期出现2次以上）</p>
<p><strong>近期冷肖：</strong>${COLD.join('、') || '无'}（近20期未开出）</p>
<p style="margin-top:8px;color:#666;font-size:13px">数据：${CORE_INFO.sites || '—'}站快照，核心分母 ${den || '—'}；杀3肖随机命中率约75%。</p>
`;
  document.getElementById('verdict').innerHTML = `
<strong><span id="verdictIssue">${NEXT_ISSUE}</span>期综合判断：</strong><br>
最不可能开的肖：<strong>${HEAVY_KILL.slice(0,4).join('、')}</strong><br>
相对看好的肖：<strong>${LIGHT_KILL.join('、')}</strong>（少站杀+冷号回补）<br>
建议关注：${LIGHT_KILL.filter(function(z){return HOT.indexOf(z)>=0}).join('、') || '无明显交叉'}（少站杀+近期热）
`;
}

function renderFreq(){
  var box=document.getElementById('freqChart'); if(!box) return;
  var max=Math.max.apply(null,Object.values(FREQ_DATA).concat([1]));
  box.innerHTML='';
  Object.entries(FREQ_DATA).sort(function(a,b){return b[1]-a[1]}).forEach(function(x){
    var z=x[0], c=x[1], pct=c/max*100;
    var color = c>=2 ? '#4caf50' : c===0 ? '#999' : '#ff9800';
    box.innerHTML += `<div class="bar-row"><div class="label">${z}</div><div class="bar-wrap"><div class="bar" style="width:${pct}%;background:${color}">${c}</div></div><div class="value">${c}次</div></div>`;
  });
}

function renderSites(){
  var box=document.getElementById('siteRanking'); if(!box) return;
  var rows=SITE_STATS.filter(function(s){return (s.kill3.hit+s.kill3.miss)>=3}).slice().sort(function(a,b){
    var pa=a.kill3.hit/(a.kill3.hit+a.kill3.miss), pb=b.kill3.hit/(b.kill3.hit+b.kill3.miss);
    return pb-pa;
  }).slice(0,10);
  box.innerHTML='<div class="site-list">';
  rows.forEach(function(s,i){
    var total=s.kill3.hit+s.kill3.miss;
    var p= total ? (s.kill3.hit/total*100).toFixed(0) : 0;
    var cls=i<3?'best':'';
    box.innerHTML += `<div class="site-chip ${cls}">#${i+1} ${s.id} ${p}%(${total}期)</div>`;
  });
  box.innerHTML += '</div>';
}

function renderAll(){
  renderKill(); renderAI(); renderFreq(); renderSites();
}

function showTab(name){
  document.querySelectorAll('.tab').forEach(function(t,i){
    t.classList.toggle('active', ['consensus','frequency','sites'][i]===name);
  });
  document.querySelectorAll('.tab-content').forEach(function(t){t.style.display='none';});
  document.getElementById('tab-'+name).style.display='block';
}

function loadAnalysis(){
  fetch('data/latest-period.json?t='+Date.now(),{cache:'no-cache'}).then(function(r){return r.json();}).then(function(lp){
    var per=Number(lp.period)||322;
    return Promise.all([
      fetch('data/core-'+per+'.json?t='+Date.now(),{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
      fetch('official-history.json?t='+Date.now(),{cache:'no-cache'}).then(function(r){return r.json();}).catch(function(){return null;}),
      fetch('data/sites-current.json?t='+Date.now(),{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
      fetch('draw-latest.json?t='+Date.now(),{cache:'no-cache'}).then(function(r){return r.json();}).catch(function(){return null;})
    ]).then(function(res){
      var core=res[0], official=res[1], sites=res[2], draw=res[3];
      if(core && core.rows && core.rows.length){
        KILL_DATA={}; core.rows.forEach(function(r){KILL_DATA[r.z]=r.coreSites;});
        CORE_INFO={sites:core.sites||0, den:core.coreDen||0};
        document.getElementById('consensusTag').textContent = '第'+per+'期 · '+CORE_INFO.sites+'站';
        document.getElementById('aiSub').textContent = CORE_INFO.sites+'站共识 · 第'+per+'期 · 自动统计';
      } else {
        document.getElementById('consensusTag').textContent = '静态快照 · 未找到'+per+'期共识';
      }
      if(official){
        var keys=Object.keys(official).filter(function(k){return /^\d+$/.test(k);}).map(Number).sort(function(a,b){return b-a;}).slice(0,20);
        FREQ_DATA={}; ZODIAC.forEach(function(z){FREQ_DATA[z]=0;});
        keys.forEach(function(p){var z=official[String(p)]&&official[String(p)].specialZod; if(z && FREQ_DATA[z]!=null) FREQ_DATA[z]++;});
        document.getElementById('freqTag').textContent = '近'+keys.length+'期 · 动态';
      }
      if(sites && sites.sites){
        SITE_STATS=sites.sites.map(function(s){return {id:s.id,kill3:s.kill3,kill6:s.kill6};});
        document.getElementById('siteTag').textContent = '第'+per+'期 · 历史回测';
      }
      if(draw){
        var m=draw.macao||{};
        var next=(draw.next && draw.next.macao && draw.next.macao.draw) || (m.draw+1);
        NEXT_ISSUE=next||NEXT_ISSUE;
        if(m.numbers && m.numbers.length){
          var Z=['马','蛇','龙','兔','虎','牛','鼠','猪','狗','鸡','猴','羊'];
          var pad=function(n){return String(n).padStart(2,'0');};
          document.getElementById('pbIssue').textContent='第'+next+'期';
          var dt=(draw.next&&draw.next.macao&&draw.next.macao.draw_at)||'';
          document.getElementById('pbTime').textContent='新澳门六合彩 · '+(dt?dt.slice(11,16)+' 开奖':'待开奖');
          document.getElementById('pbLastLabel').textContent=m.draw+'期开奖';
          var ns=m.numbers.slice(0,-1).map(function(n){return pad(n)+Z[(n-1)%12];});
          var sp=m.numbers[m.numbers.length-1];
          document.getElementById('pbLastNums').textContent=ns.join(' ')+' + '+pad(sp)+Z[(sp-1)%12];
        }
      }
      renderAll();
    });
  }).catch(function(){
    document.getElementById('consensusTag').textContent='静态快照 · 读取失败';
    renderAll();
  });
}

renderAll();
loadAnalysis();
</script>
</body>
</html>
