<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多站资料对比系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#222;font-size:15px}
.header{background:#1a1a1a;color:#fff;padding:10px 14px;position:sticky;top:0;z-index:100}
.header h1{font-size:16px;font-weight:600}
.header .sub{font-size:12px;color:#999;margin-top:2px}
.tabs{display:flex;background:#2a2a2a;overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:46px;z-index:99}
.tab{padding:10px 14px;color:#888;font-size:13px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
.tab.active{color:#fff;border-bottom-color:#e63;font-weight:600}
.content{padding:10px;padding-bottom:60px}
.summary-bar{background:#fff;border-radius:8px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-around;text-align:center}
.summary-bar .item .num{font-size:20px;font-weight:700}
.summary-bar .item .label{font-size:11px;color:#888;margin-top:2px}
.card{background:#fff;border-radius:8px;margin-bottom:10px;overflow:hidden}
.card-title{padding:10px 14px;border-bottom:1px solid #eee;font-weight:600;font-size:14px;background:#fafafa}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #f5f5f5}
.row:last-child{border-bottom:none}
.row .name{color:#444;font-size:14px;flex:1}
.row .val{font-weight:600;font-size:14px;text-align:right}
.val.hit{color:#0a0}
.val.miss{color:#c00}
.val.pending{color:#999}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid #eee}
th{background:#fafafa;font-weight:600;color:#555}
td.name-cell{text-align:left;font-weight:500;color:#333}
.note{font-size:12px;color:#666;padding:10px 14px;background:#fffbe6;border-radius:4px;margin-bottom:10px;line-height:1.6}
.stat-good{color:#0a0;font-weight:600}
.stat-bad{color:#c00;font-weight:600}
.stat-warn{color:#e80;font-weight:600}
</style>
</head>
<body>
<div class="header">
  <h1>多站资料对比系统</h1>
  <div class="sub" id="subTitle">加载中...</div>
</div>
<div class="tabs" id="tabs"></div>
<div class="content" id="content"></div>
<script>
let SITES = [];
let SITE_INFO = {};
let currentTab = "summary";

function renderTabs(){
  const t = document.getElementById("tabs");
  let html = `<div class="tab ${currentTab==='summary'?'active':''}" onclick="switchTab('summary')">汇总</div>`;
  SITES.forEach(s=>{
    html += `<div class="tab ${currentTab===s.id?'active':''}" onclick="switchTab('${s.id}')">${s.id}</div>`;
  });
  t.innerHTML = html;
}

function switchTab(id){
  currentTab = id;
  renderTabs();
  renderContent();
}

function renderContent(){
  const c = document.getElementById("content");
  if(currentTab === "summary"){
    c.innerHTML = renderSummary();
  } else {
    c.innerHTML = renderSite(currentTab);
  }
}

function pct(hit, miss){
  const t = hit+miss;
  if(t === 0) return '<span class="val pending">无数据</span>';
  const p = hit/t*100;
  const cls = p >= 80 ? 'stat-good' : p >= 60 ? 'stat-warn' : 'stat-bad';
  return `<span class="${cls}">${hit}/${t} = ${p.toFixed(0)}%</span>`;
}

function renderSummary(){
  let html = `<div class="note">同一运营方CDN体系，共${SITES.length}个站有数据。杀肖类栏目命中率普遍较高（杀3肖约75%随机基准），平特1肖接近随机水平（8%基准）。历史数据越多的站越有参考价值。</div>`;
  
  html += `<div class="summary-bar">
    <div class="item"><div class="num">${SITES.length}</div><div class="label">站点数</div></div>
    <div class="item"><div class="num" id="curIssue">${SITE_INFO.period || "—"}</div><div class="label">当前期</div></div>
    <div class="item"><div class="num" style="color:#e63">${SITE_INFO.drawTime || "21:30"}</div><div class="label">开奖</div></div>
  </div>`;

  // 杀特3肖排名
  html += `<div class="card"><div class="card-title">杀特3肖历史命中率排名</div><table><tr><th>站点</th><th>命中率</th><th>样本</th></tr>`;
  const k3 = SITES.filter(s=>{const t=s.kill3.hit+s.kill3.miss;return t>=3}).sort((a,b)=>{
    const pa=a.kill3.hit/(a.kill3.hit+a.kill3.miss), pb=b.kill3.hit/(b.kill3.hit+b.kill3.miss);
    return pb-pa;
  });
  k3.forEach(s=>{
    const t=s.kill3.hit+s.kill3.miss;
    html += `<tr><td class="name-cell">${s.id}${s.id==='0491'?' (本站)':''}</td><td>${pct(s.kill3.hit,s.kill3.miss)}</td><td>${t}期</td></tr>`;
  });
  html += `</table></div>`;

  // 杀特6肖排名
  html += `<div class="card"><div class="card-title">杀特6肖历史命中率排名</div><table><tr><th>站点</th><th>命中率</th><th>样本</th></tr>`;
  const k6 = SITES.filter(s=>{const t=s.kill6.hit+s.kill6.miss;return t>=3}).sort((a,b)=>{
    const pa=a.kill6.hit/(a.kill6.hit+a.kill6.miss), pb=b.kill6.hit/(b.kill6.hit+b.kill6.miss);
    return pb-pa;
  });
  k6.forEach(s=>{
    const t=s.kill6.hit+s.kill6.miss;
    html += `<tr><td class="name-cell">${s.id}${s.id==='0491'?' (本站)':''}</td><td>${pct(s.kill6.hit,s.kill6.miss)}</td><td>${t}期</td></tr>`;
  });
  html += `</table></div>`;

  // 平特1肖排名
  html += `<div class="card"><div class="card-title">平特1肖历史命中率（随机基准8%）</div><table><tr><th>站点</th><th>命中率</th><th>样本</th></tr>`;
  const pt = SITES.filter(s=>{const t=s.pingte.hit+s.pingte.miss;return t>=3}).sort((a,b)=>{
    const pa=a.pingte.hit/(a.pingte.hit+a.pingte.miss), pb=b.pingte.hit/(b.pingte.hit+b.pingte.miss);
    return pb-pa;
  });
  pt.forEach(s=>{
    const t=s.pingte.hit+s.pingte.miss;
    html += `<tr><td class="name-cell">${s.id}${s.id==='0491'?' (本站)':''}</td><td>${pct(s.pingte.hit,s.pingte.miss)}</td><td>${t}期</td></tr>`;
  });
  html += `</table></div>`;

  // 全部站点列表
  html += `<div class="card"><div class="card-title">全部${SITES.length}个站</div><table><tr><th>站点</th><th>栏目数</th><th>当前期</th></tr>`;
  SITES.forEach(s=>{
    html += `<tr><td class="name-cell">${s.id}${s.id==='0491'?' (本站)':''}</td><td>${s.widgets}</td><td>${s.period}</td></tr>`;
  });
  html += `</table></div>`;

  return html;
}

function renderSite(siteId){
  const s = SITES.find(x=>x.id===siteId);
  let html = `<div class="note">siteKey=${s.id} · ${s.widgets}个栏目 · 当前期=${s.period}${s.id==='0491'?' · 本站':''}</div>`;
  
  html += `<div class="card"><div class="card-title">历史命中率</div>
    <div class="row"><span class="name">杀特3肖</span><span class="val">${pct(s.kill3.hit,s.kill3.miss)}</span></div>
    <div class="row"><span class="name">杀特6肖</span><span class="val">${pct(s.kill6.hit,s.kill6.miss)}</span></div>
    <div class="row"><span class="name">平特1肖</span><span class="val">${pct(s.pingte.hit,s.pingte.miss)}</span></div>
  </div>`;

  // 历史明细
  if(s.history && Object.keys(s.history).length > 0){
    html += `<div class="card"><div class="card-title">历史推荐明细</div>`;
    for(const [col, data] of Object.entries(s.history)){
      html += `<div class="card-title" style="background:#f0f0f0">${col}</div>`;
      for(const [issue, val] of Object.entries(data).sort((a,b)=>parseInt(b[0])-parseInt(a[0]))){
        html += `<div class="row"><span class="name">${issue}期</span><span class="val">${val}</span></div>`;
      }
    }
    html += `</div>`;
  }

  return html;
}

function syncIssue(){
  if(!SITES.length) return;
  const maxP = Math.max.apply(null, SITES.map(s=>s.period));
  document.getElementById("subTitle").textContent = `${SITES.length}站 · 资料至 ${maxP} 期 · 新澳门六合彩`;
  fetch('draw-latest.json?t='+Date.now(), {cache:'no-cache'}).then(r=>r.json()).then(d=>{
    const next = (d.next && d.next.macao && d.next.macao.draw) || ((d.macao && d.macao.draw) + 1);
    SITE_INFO.period = next || SITE_INFO.period;
    const el = document.getElementById('curIssue');
    if(el && next) el.textContent = next;
    const tm = (d.next && d.next.macao && d.next.macao.draw_at) || '';
    if(tm) SITE_INFO.drawTime = tm.slice(11,16);
  }).catch(()=>{});
}
(function initSites(){
  fetch('data/sites-current.json?t='+Date.now(), {cache:'no-cache'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){
      SITES = (d && d.sites) || [];
      SITE_INFO = {period: (d && d.period), updatedAt: (d && d.updatedAt)};
      renderTabs(); renderContent(); syncIssue();
    })
    .catch(function(e){
      document.getElementById('subTitle').textContent = '站点数据读取失败：' + e.message;
      document.getElementById('content').innerHTML = '<div class="note">读不到 data/sites-current.json。请确认本页是通过 HTTP 打开，而不是直接双击文件。</div>';
    });
})();
</script>
</body>
</html>
