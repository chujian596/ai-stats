let currentTab = "summary";

function renderTabs(){
  const t = document.getElementById("tabs");
  let html = `<div class="tab ${currentTab==='summary'?'active':''}" onclick="switchTab('summary')">汇总</div>`;
  SITES.forEach(s=>{
    html += `<div class="tab ${currentTab===s.id?'active':''}" onclick="switchTab('${s.id}')">${s.id}</div>`;
  });
  t.innerHTML = html;
}

function switchTab(id){
  currentTab = id;
  renderTabs();
  renderContent();
}

function renderContent(){
  const c = document.getElementById("content");
  if(currentTab === "summary"){
    c.innerHTML = renderSummary();
  } else {
    c.innerHTML = renderSite(currentTab);
  }
}

function pct(hit, miss){
  const t = hit+miss;
  if(t === 0) return '<span class="val pending">无数据</span>';
  const p = hit/t*100;
  const cls = p >= 80 ? 'stat-good' : p >= 60 ? 'stat-warn' : 'stat-bad';
  return `<span class="${cls}">${hit}/${t} = ${p.toFixed(0)}%</span>`;
}

function renderSummary(){
  let html = `<div class="note">同一运营方CDN体系，共${SITES.length}个站有数据。杀肖类栏目命中率普遍较高（杀3肖约75%随机基准），平特1肖接近随机水平（8%基准）。历史数据越多的站越有参考价值。</div>`;
  
  html += `<div class="summary-bar">
    <div class="item"><div class="num">${SITES.length}</div><div class="label">站点数</div></div>
    <div class="item"><div class="num" id="curIssue">318</div><div class="label">当前期</div></div>
    <div class="item"><div class="num" style="color:#e63">21:32</div><div class="label">开奖</div></div>
  </div>`;

  // 杀特3肖排名
  html += `<div class="card"><div class="card-title">杀特3肖历史命中率排名</div><table><tr><th>站点</th><th>命中率</th><th>样本</th></tr>`;
  const k3 = SITES.filter(s=>{const t=s.kill3.hit+s.kill3.miss;return t>=3}).sort((a,b)=>{
    const pa=a.kill3.hit/(a.kill3.hit+a.kill3.miss), pb=b.kill3.hit/(b.kill3.hit+b.kill3.miss);
    return pb-pa;
  });
  k3.forEach(s=>{
    const t=s.kill3.hit+s.kill3.miss;
    html += `<tr><td class="name-cell">${s.id}${s.id==='0491'?' (本站)':''}</td><td>${pct(s.kill3.hit,s.kill3.miss)}</td><td>${t}期</td></tr>`;
  });
  html += `</table></div>`;

  // 杀特6肖排名
  html += `<div class="card"><div class="card-title">杀特6肖历史命中率排名</div><table><tr><th>站点</th><th>命中率</th><th>样本</th></tr>`;
  const k6 = SITES.filter(s=>{const t=s.kill6.hit+s.kill6.miss;return t>=3}).sort((a,b)=>{
    const pa=a.kill6.hit/(a.kill6.hit+a.kill6.miss), pb=b.kill6.hit/(b.kill6.hit+b.kill6.miss);
    return pb-pa;
  });
  k6.forEach(s=>{
    const t=s.kill6.hit+s.kill6.miss;
    html += `<tr><td class="name-cell">${s.id}${s.id==='0491'?' (本站)':''}</td><td>${pct(s.kill6.hit,s.kill6.miss)}</td><td>${t}期</td></tr>`;
  });
  html += `</table></div>`;

  // 平特1肖排名
  html += `<div class="card"><div class="card-title">平特1肖历史命中率（随机基准8%）</div><table><tr><th>站点</th><th>命中率</th><th>样本</th></tr>`;
  const pt = SITES.filter(s=>{const t=s.pingte.hit+s.pingte.miss;return t>=3}).sort((a,b)=>{
    const pa=a.pingte.hit/(a.pingte.hit+a.pingte.miss), pb=b.pingte.hit/(b.pingte.hit+b.pingte.miss);
    return pb-pa;
  });
  pt.forEach(s=>{
    const t=s.pingte.hit+s.pingte.miss;
    html += `<tr><td class="name-cell">${s.id}${s.id==='0491'?' (本站)':''}</td><td>${pct(s.pingte.hit,s.pingte.miss)}</td><td>${t}期</td></tr>`;
  });
  html += `</table></div>`;

  // 全部站点列表
  html += `<div class="card"><div class="card-title">全部${SITES.length}个站</div><table><tr><th>站点</th><th>栏目数</th><th>当前期</th></tr>`;
  SITES.forEach(s=>{
    html += `<tr><td class="name-cell">${s.id}${s.id==='0491'?' (本站)':''}</td><td>${s.widgets}</td><td>${s.period}</td></tr>`;
  });
  html += `</table></div>`;

  return html;
}

function renderSite(siteId){
  const s = SITES.find(x=>x.id===siteId);
  let html = `<div class="note">siteKey=${s.id} · ${s.widgets}个栏目 · 当前期=${s.period}${s.id==='0491'?' · 本站':''}</div>`;
  
  html += `<div class="card"><div class="card-title">历史命中率</div>
    <div class="row"><span class="name">杀特3肖</span><span class="val">${pct(s.kill3.hit,s.kill3.miss)}</span></div>
    <div class="row"><span class="name">杀特6肖</span><span class="val">${pct(s.kill6.hit,s.kill6.miss)}</span></div>
    <div class="row"><span class="name">平特1肖</span><span class="val">${pct(s.pingte.hit,s.pingte.miss)}</span></div>
  </div>`;

  // 历史明细
  if(s.history && Object.keys(s.history).length > 0){
    html += `<div class="card"><div class="card-title">历史推荐明细</div>`;
    for(const [col, data] of Object.entries(s.history)){
      html += `<div class="card-title" style="background:#f0f0f0">${col}</div>`;
      for(const [issue, val] of Object.entries(data).sort((a,b)=>parseInt(b[0])-parseInt(a[0]))){
        html += `<div class="row"><span class="name">${issue}期</span><span class="val">${val}</span></div>`;
      }
    }
    html += `</div>`;
  }

  return html;
}

(function syncIssue(){
  const maxP = Math.max.apply(null, SITES.map(s=>s.period));
  document.getElementById("subTitle").textContent = `${SITES.length}站 · 资料至 ${maxP} 期 · 新澳门六合彩`;
  fetch('draw-latest.json?t='+Date.now(), {cache:'no-cache'}).then(r=>r.json()).then(d=>{
    const next = (d.next && d.next.macao && d.next.macao.draw) || ((d.macao && d.macao.draw) + 1);
    const el = document.getElementById("curIssue");
    if(el && next) el.textContent = next;
  }).catch(()=>{});
})();

renderContent();
